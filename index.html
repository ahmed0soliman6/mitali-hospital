<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#173B4A">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
  
<title>نظام إدارة مستشفى لجنة زكاة ميت على التخصصي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;900&family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>window.MITALI_API_BASE = window.location.protocol === "file:" ? "https://mitali1.vercel.app" : "";</script>
<script src="./firebase-store.js"></script>
<style>
  :root{
    --navy:#173B4A;
    --navy-deep:#102A35;
    --teal:#0F6674;
    --teal-light:#2FA39A;
    --bg:#F6F4EE;
    --card:#FFFFFF;
    --ink:#1D2B2E;
    --muted:#6B7A7D;
    --line:#E7E2D6;
    --border:#E7E2D6;
    --income:#2E7D5B;
    --income-soft:#E4F3EC;
    --expense:#B5482F;
    --expense-soft:#FBEAE4;
    --gold:#C79A3E;
    --input-bg:#FCFBF8;
    --radius:8px;
    --shadow: 0 1px 3px rgba(16,42,53,.06), 0 6px 16px -8px rgba(16,42,53,.22);
    --row-hover: rgba(23,59,74,.045);
  }
  /* الوضع الليلي - يُفعَّل بإضافة data-theme="dark" على عنصر <html>، ويُحفَظ
     الاختيار فى localStorage ليبقى ثابتًا بين الجلسات. الألوان الوظيفية (المدير،
     الشريط الجانبي) قريبة من الأصل لأنها داكنة أصلًا وتناسب الوضعين، بينما
     الخلفيات والنصوص والألوان الفاتحة (وارد/منصرف الخفيفة) استُبدلت بمعادلات
     داكنة مريحة للعين بدل الألوان الباهتة الأصلية غير المناسبة لخلفية داكنة. */
  html[data-theme="dark"]{
    --bg:#0F1A1D;
    --card:#182528;
    --ink:#E8EEEC;
    --muted:#93A5A3;
    --line:#2A3A3D;
    --border:#2A3A3D;
    --income:#4FBF8E;
    --income-soft:#173028;
    --expense:#E2755A;
    --expense-soft:#33201B;
    --gold:#D9B15E;
    --input-bg:#111F22;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
    --row-hover: rgba(255,255,255,.055);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Cairo',sans-serif;
    background:var(--bg);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    font-size:14.5px;
  }
  h1,h2,h3,.display{font-family:'Tajawal',sans-serif;}
  ::selection{background:var(--gold); color:#fff;}

  /* ---------- Sidebar ---------- */
  #sidebar{
    width:250px; min-width:250px;
    background:linear-gradient(180deg,var(--navy) 0%, var(--navy-deep) 100%);
    color:#EAF1EF;
    display:flex; flex-direction:column;
    position:sticky; top:0; height:100vh;
  }
  /* إصلاح: كان الشريط الجانبي بياخد مساحة ثابتة دايمًا حتى على الموبايل (250px من
     شاشة عرضها غالبًا أقل من 400px)، يعني يشيل تقريبًا ثلث الشاشة بشكل دائم. تحت
     880px بيتحول لدرج منزلق (Drawer): مخفي افتراضيًا، ويظهر بزرار ☰ فى الشريط
     العلوي، فوق المحتوى مباشرة، مع خلفية معتمة تقفله لو ضغطت بره. */
  #sidebarOverlay{ display:none; }
  @media (max-width:880px){
    #sidebar{
      position:fixed; right:0; top:0; height:100dvh; width:82vw; max-width:300px;
      z-index:1400; transform:translateX(100%); transition:transform .25s ease;
      box-shadow:-8px 0 30px rgba(0,0,0,.25);
    }
    body.sidebar-open #sidebar{ transform:translateX(0); }
    #sidebarOverlay{
      display:none; position:fixed; inset:0; background:rgba(16,42,53,.5); z-index:1390;
    }
    body.sidebar-open #sidebarOverlay{ display:block; }
    #hamburgerBtn{ display:inline-flex !important; }
    /* إصلاح حرج: overflow-x:hidden على body أو #main (وهما من أسلاف #topbar فى
       شجرة DOM) يكسر خاصية position:sticky الخاصة به فى كثير من المتصفحات - وهو
       بالضبط ما كان يجعل شريط القائمة العلوي (وزرار ☰) يختفي عند التمرير لأسفل
       بدل أن يبقى ثابتًا فى الأعلى. الحل: نقل القيد لـ #content فقط، وهو عنصر
       شقيق لـ #topbar (وليس أحد أسلافه)، فلا يؤثر على تثبيته إطلاقًا مع بقائه
       يمنع أي تمرير أفقي غير مقصود لمحتوى الصفحة نفسه. */
    /* لا نقص عرض الصفحات الطويلة أو الجداول على الهاتف؛ اترك التمرير الأفقي
       للحاوية المناسبة بدل إخفاء النص أو آخر الأعمدة. */
    #content{ overflow-x:auto; max-width:none; }
  }
  .brand{
    padding:22px 20px 16px;
    border-bottom:1px solid rgba(255,255,255,.08);
  }
  .brand .name{font-family:'Tajawal'; font-weight:900; font-size:17px; line-height:1.3;}
  .brand .sub{font-size:11px; color:#9FB6B9; margin-top:4px;}
  nav{flex:1; padding:14px 10px; overflow-y:auto;}
  .nav-group-label{font-size:10.5px; color:#7FA0A0; margin:16px 10px 6px; letter-spacing:.4px; text-transform:uppercase;}
  .nav-item{
    display:flex; align-items:center; gap:10px;
    padding:10px 12px; border-radius:10px; cursor:pointer;
    color:#D7E4E2; font-size:13.5px; font-weight:600;
    transition:background .15s, color .15s;
    margin-bottom:2px;
  }
  .nav-item:hover{background:rgba(255,255,255,.06);}
  .nav-item.active{background:var(--teal); color:#fff; box-shadow:var(--shadow);}
  .nav-item .ic{width:18px; text-align:center; font-size:15px;}
  .nav-item .badge{
    margin-inline-start:auto; background:var(--expense); color:#fff;
    font-size:10px; font-weight:700; border-radius:20px; padding:1px 7px;
  }
  .sidebar-foot{padding:12px 14px; border-top:1px solid rgba(255,255,255,.08); font-size:12px; color:#8FA9A8;}
  .sidebar-account{border-top:1px solid rgba(255,255,255,.08); padding:12px 14px 10px; color:#EAF1EF;}
  .sidebar-account-user{font-size:12px; font-weight:800; line-height:1.55; margin-bottom:9px;}
  .sidebar-account-user .role{font-size:11px; color:#9FB6B9; font-weight:600;}
  .sidebar-account-actions{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:9px;}
  .sidebar-account-actions .btn,
  #sidebar .sidebar-account-actions .btn.ghost{flex:1 1 auto; min-width:0; padding:7px 8px; font-size:11px; border-color:rgba(255,255,255,.26); color:#fff !important; background:rgba(255,255,255,.08); text-shadow:0 1px 1px rgba(0,0,0,.2);}
  .sidebar-account-actions .btn:hover{background:rgba(255,255,255,.16);}
  .sidebar-connection{display:flex; align-items:center; justify-content:flex-start; gap:8px; font-size:11px; color:#DDE9E7;}
  .sidebar-connection #storageIndicator{padding:0; border:0; color:#BFE8D4; flex:1;}
  .sidebar-connection-top{padding:10px 14px; border-bottom:1px solid rgba(255,255,255,.08); background:rgba(0,0,0,.08);}
  .sidebar-connection-top > span:first-child{font-weight:700; color:#fff;}
  .sidebar-connection .theme-toggle{width:30px; min-width:30px; height:28px; padding:0; display:inline-flex; align-items:center; justify-content:center; border:1px solid rgba(255,255,255,.18); color:#EAF1EF; background:rgba(255,255,255,.06);}
  .sidebar-connection .theme-toggle:hover{background:rgba(255,255,255,.13);}
  .dashboard-link-card{cursor:pointer; transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;}
  .dashboard-link-card:hover{transform:translateY(-2px); border-color:var(--teal); box-shadow:0 8px 22px rgba(15,102,116,.16);}
  .dashboard-link-card:focus-visible{outline:3px solid color-mix(in srgb, var(--teal) 45%, transparent); outline-offset:2px;}
  html[data-theme="dark"] .dashboard-link-card:hover{box-shadow:0 8px 24px rgba(0,0,0,.38);}
  .card .label{color:var(--muted);}
  .card input, .card select, .card textarea{background:var(--input-bg); color:var(--ink); border-color:var(--border);}
  html[data-theme="dark"] .hint{color:#AFC0BD;}

  /* ---------- Main ---------- */
  #main{flex:1; min-width:0; display:flex; flex-direction:column;}
  #topbar{
    background:var(--card); border-bottom:1px solid var(--line);
    padding:14px 26px; display:flex; align-items:center; justify-content:space-between;
    position:sticky; top:0; z-index:5;
  }
  #topbar .title{font-family:'Tajawal'; font-weight:700; font-size:19px;}
  #topbar .date{font-size:12.5px; color:var(--muted);}
  .top-connection-indicator{display:inline-flex; align-items:center; gap:5px; margin-inline-start:12px; padding:5px 9px; border-radius:999px; background:var(--income-soft); color:var(--income); font-size:11px; font-weight:800; white-space:nowrap;}
  .top-connection-indicator.is-offline{background:var(--expense-soft); color:var(--expense);}
  .top-connection-indicator.is-pending{background:var(--gold-soft); color:var(--gold);}
  .offline-save-notice{display:none; align-items:center; gap:6px; margin-inline-start:8px; padding:5px 9px; border-radius:9px; background:var(--expense-soft); color:var(--expense); font-size:10.5px; font-weight:800; line-height:1.35;}
  .offline-save-notice.is-visible{display:inline-flex;}
  .offline-save-notice.is-pending{background:var(--gold-soft); color:var(--gold);}
  .diary-form{display:block !important;}
  .diary-form .diary-primary-row,.diary-form .diary-triple-row,.diary-form .diary-bottom-row{display:grid; gap:10px; margin-bottom:10px;}
  .diary-form .diary-primary-row{grid-template-columns:1fr 1fr;}
  .diary-form .diary-triple-row{grid-template-columns:repeat(3,minmax(0,1fr));}
  .diary-form .diary-bottom-row{grid-template-columns:repeat(3,minmax(0,1fr)); align-items:end;}
  .diary-form .field{min-width:0;}
  .diary-form .diary-primary-row .field,.diary-form .diary-triple-row .field,.diary-form .diary-bottom-row .field{grid-column:auto !important;}
  .top-alerts-wrap{position:relative; display:inline-flex; flex:0 0 auto;}
  .top-alerts-btn{position:relative; display:inline-flex; align-items:center; justify-content:center; width:34px; min-width:34px; height:30px; padding:0; border:1px solid var(--line); border-radius:9px; background:var(--card); color:var(--ink); font-size:16px; cursor:pointer;}
  .top-reload-btn{display:inline-flex; align-items:center; justify-content:center; gap:4px; min-width:34px; height:30px; padding:4px 8px; border:1px solid var(--line); border-radius:9px; background:var(--card); color:var(--ink); font-size:12px; font-weight:800; cursor:pointer;}
  .top-reload-btn:disabled{opacity:.6; cursor:wait;}
  .top-alerts-badge{position:absolute; top:-7px; right:-7px; min-width:18px; height:18px; padding:0 4px; border-radius:999px; background:var(--expense); color:#fff; font-size:10px; line-height:18px; font-weight:900; text-align:center;}
  .top-alerts-panel{position:absolute; top:calc(100% + 9px); inset-inline-end:0; z-index:1000; width:min(360px,calc(100vw - 22px)); max-height:min(60vh,430px); overflow-y:auto; overscroll-behavior:contain; padding:10px; border:1px solid var(--line); border-radius:12px; background:var(--card); box-shadow:0 14px 36px rgba(0,0,0,.18); color:var(--ink);}
  .top-alerts-panel[hidden]{display:none;}
  .top-alert-item{display:flex; align-items:flex-start; gap:8px; padding:9px 7px; border-bottom:1px solid var(--line); font-size:12px; line-height:1.55;}
  .top-alert-item:last-child{border-bottom:0;}
  .top-alert-link{cursor:pointer; border-radius:8px; transition:background-color .16s ease, transform .16s ease;}
  .top-alert-link:hover,.top-alert-link:focus-visible{background:var(--soft,#eef5f5); outline:none;}
  .top-alert-link:active{transform:scale(.99);}
  .top-alert-item strong{display:block; font-size:12px;}
  .top-alert-item .hint{display:block; margin-top:2px;}
  .top-alert-action{margin-top:8px; width:100%;}
  .top-connection-indicator .connection-dot{font-size:10px; width:8px; height:8px; border-radius:50%; background:currentColor; display:inline-block;}
  .release-card{display:flex; align-items:center; gap:9px; flex-wrap:wrap; margin-bottom:12px; padding:8px 11px; border:1px solid var(--line); border-inline-start:3px solid var(--teal); border-radius:10px; background:var(--card); color:var(--muted); font-size:11px; box-shadow:var(--shadow);}
  .release-card strong{color:var(--navy); font-size:12px; white-space:nowrap;}
  .outstanding-cards-grid{display:block; width:100%;}
  .outstanding-intro{margin-bottom:18px; padding:4px 0 12px; border-inline-start:4px solid var(--teal); padding-inline-start:12px;}
  .outstanding-card{display:block; width:100%; min-width:0; overflow:hidden; background:transparent; border:0; border-top:4px solid var(--outstanding-accent); border-radius:0; box-shadow:none; padding:0 0 18px;}
  .outstanding-card-header{display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:12px; padding-bottom:10px; border-bottom:1px solid color-mix(in srgb, var(--outstanding-accent) 25%, var(--line));}
  .outstanding-card-title{display:flex; align-items:center; gap:7px; color:var(--outstanding-accent); font-weight:900; font-size:14px; line-height:1.45;}
  .outstanding-card-icon{display:inline-flex; align-items:center; justify-content:center; width:28px; height:28px; border-radius:9px; background:var(--outstanding-soft); flex-shrink:0;}
  .outstanding-card .table-wrap{width:100%; max-width:100%; overflow-x:auto; -webkit-overflow-scrolling:touch; background:var(--card); border:1px solid var(--line); border-radius:var(--radius);}
  .outstanding-card table{width:100%; min-width:760px;}
  .outstanding-pagination{display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; padding-top:12px;}
  .outstanding-pagination-actions{display:flex; align-items:center; gap:7px;}
  .outstanding-pagination-actions strong{font-size:12px; color:var(--outstanding-accent);}
  @media (max-width:880px){.outstanding-cards-grid{display:block; width:100%;}}
  @media (max-width:880px){
    #topbar{ padding:10px 14px; flex-wrap:wrap; row-gap:8px; }
    #topbar .date{ display:none; }
    #topbar .title{ font-size:16px; }
    #topbar .pill{ display:none; }
    #topbar .btn.sm{ padding:6px 9px; font-size:12px; }
  }
  @media (max-width:560px){
    #topbar{padding:8px 10px; gap:6px; align-items:center; min-height:58px;}
    #topbar > div:first-child{gap:5px;}
    #topbar #backBtn{display:inline-flex !important;}
    .visit-grid-3{grid-template-columns:1fr !important; gap:10px;}
    .visit-grid-3 [style*="grid-column:span 2"]{grid-column:span 1 !important;}

    .sidebar-account-actions .btn{font-size:11px; padding:7px 6px;}
    #topbar > div:first-child{min-width:0; flex:1 1 70%; flex-wrap:wrap;}
    #topbar > div:last-child{min-width:0; flex:0 0 auto; justify-content:flex-start; gap:5px; flex-wrap:wrap;}
    #topbar .title{font-size:14px; max-width:none; flex:1 1 auto; min-width:0; overflow:visible; text-overflow:clip; white-space:normal; line-height:1.35;}
    #topConnectionIndicator{display:inline-flex; margin-inline-start:43px; margin-top:2px;}
    .top-connection-indicator{padding:4px 7px; font-size:10px; gap:4px;}
    #topThemeToggleBtn{display:inline-flex; align-items:center; justify-content:center; width:32px; min-width:32px; height:30px; padding:0;}
    .top-reload-btn{min-width:32px; width:32px; padding:0; font-size:15px;}
    .top-reload-btn span{display:none;}
    .top-alerts-panel{position:fixed; top:clamp(88px,14vh,150px); inset-inline-start:10px; inset-inline-end:10px; width:auto; max-width:none; max-height:calc(100dvh - clamp(118px,18vh,190px)); overflow-y:auto; z-index:1100;}
    .top-alert-item{font-size:13px; padding:12px 9px;}
    .top-alert-item strong{font-size:13px;}
    #topbar .btn.sm{padding:5px 7px; font-size:11px;}
    #content{padding:12px 10px 42px; width:100%; min-width:0;}
    .form-grid{grid-template-columns:1fr !important; gap:10px;}
    .diary-form .diary-primary-row{grid-template-columns:repeat(2,minmax(0,1fr));}
    .diary-form .diary-triple-row{grid-template-columns:repeat(3,minmax(0,1fr)); gap:7px;}
    .diary-form .diary-bottom-row{grid-template-columns:repeat(3,minmax(0,1fr)); gap:7px;}
    .diary-form .field label{font-size:12px; line-height:1.35;}
    .diary-form input,.diary-form select,.diary-form textarea{min-width:0; font-size:13px;}
    .top-alerts-panel{inset-inline-start:10px; inset-inline-end:10px;}
    .two-col{grid-template-columns:1fr; gap:10px;}
    .table-wrap{width:100%; max-width:100%; overflow-x:auto; -webkit-overflow-scrolling:touch;}
    .table-wrap table{min-width:620px;}
    .section-title{font-size:14px;}
  }
  #content{padding:22px 26px 60px; flex:1; min-width:0;}

  /* ---------- Cards / grid ---------- */
  .grid{display:grid; gap:12px;}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .grid-2{grid-template-columns:repeat(2,1fr);}
  @media (max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);}}
  /* تخطيط الهاتف: بطاقتا KPI في الصف مع السماح بانكسار العناوين الطويلة
     بطريقة مقروءة، لتقليل التمرير الرأسي مع الحفاظ على وضوح البيانات. */
  @media (max-width:560px){
    /* بطاقات لوحة التحكم: بطاقتان في الصف على الهاتف بدل بطاقة واحدة */
    .grid-4, .grid-3, .grid-2{grid-template-columns:repeat(2, minmax(0, 1fr)); gap:10px;}
    .grid-4 > .card, .grid-3 > .card, .grid-2 > .card{min-width:0;}
    .grid-4 .label, .grid-3 .label, .grid-2 .label{overflow-wrap:anywhere; line-height:1.35;}
    .outstanding-card{padding:0 0 14px;}
    .outstanding-card-header{align-items:flex-start; padding-inline:2px;}
    .outstanding-card .table-wrap{border-radius:10px;}
    .outstanding-card table{min-width:700px;}
    .outstanding-card-title{font-size:13px;}
    .outstanding-card .btn.sm{font-size:10px; padding:5px 7px;}
  }

  .card{
    background:var(--card); border:1.5px solid var(--line); border-radius:var(--radius);
    padding:16px; box-shadow:var(--shadow);
  }
  @media (max-width:560px){
    .card{padding:14px; border-width:1.5px;}
    .kpi .value{font-size:21px;}
    .kpi.hero .value{font-size:25px;}
  }
  .kpi .label{font-size:12px; color:var(--muted); font-weight:600; margin-bottom:8px;}
  .kpi .value{font-family:'Tajawal'; font-weight:900; font-size:24px; color:var(--navy);}
  .kpi .value.income{color:var(--income);}
  .kpi .value.expense{color:var(--expense);}
  .kpi .delta{font-size:11.5px; margin-top:6px; color:var(--muted);}
  .kpi.hero{
    background:linear-gradient(135deg,var(--navy) 0%, var(--teal) 130%);
    color:#fff; border:none; position:relative; overflow:hidden;
  }
  .kpi.hero .label{color:#CFE4E1;}
  .kpi.hero .value{color:#fff; font-size:28px;}
  .kpi.hero::after{
    content:''; position:absolute; inset-inline-end:-30px; bottom:-30px; width:140px; height:140px;
    background:radial-gradient(circle, rgba(255,255,255,.14), transparent 70%);
  }

  .section-title{font-family:'Tajawal'; font-weight:700; font-size:15.5px; margin-bottom:14px; display:flex; align-items:center; justify-content:space-between;}
  .section-title .hint{font-size:11.5px; color:var(--muted); font-weight:500;}

  /* ---------- Forms ---------- */
  .form-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
  @media (max-width:900px){.form-grid{grid-template-columns:repeat(2,1fr);}}
  /* نموذج تسجيل الزيارة تحديدًا: 3 أعمدة ثابتة فى كل المقاسات (حتى على الهاتف)
     لإعطاء شكل متسق فى 4 صفوف بدل تغيّر عدد الأعمدة حسب عرض الشاشة. */

// ======================================================================

function applyTheme(theme) {

}
(function initTheme() {

// تصنيفات الوارد والمنصرف - قابلة للإدارة بالكامل (إضافة/تعديل/حذف/ترتيب)
function seedCategories() {
  return {
    income: ["كشف","تحاليل","أشعة","أسنان","عمليات","تبرعات","أخرى"].map((name, i) => ({ id: uid(), name, order: i })),

}
function sortedCats(kind) {
  const list = (DB.categories && DB.categories[kind]) ? DB.categories[kind] : [];
  return [...list].sort((a, b) => (a.order ?? 0) - (b.order ?? 0));

function catNames(kind) { return sortedCats(kind).map(c => c.name); }
function isCatUsed(kind, name) {

// تخصصات الأطباء - قابلة للإدارة بالكامل (إضافة/حذف) وتُحدَّث فورًا فى كل النظام

}

function specNames() { return sortedSpecs().map(s => s.name); }
function isSpecUsed(name) { return DB.doctors.some(d => d.specialty === name); }

// ======================================================================
// نظام الصلاحيات التفصيلية لكل مستخدم
// ======================================================================
const PERMISSION_MODULES = [

  { key: "categories", label: "إدارة التصنيفات", actions: [

  ]},

function emptyPermissions() {
  const p = {};
  PERMISSION_MODULES.forEach(m => { p[m.key] = {}; m.actions.forEach(a => { p[m.key][a.key] = false; }); });
  return p;
}
function fullPermissions() {
  const p = {};
  PERMISSION_MODULES.forEach(m => { p[m.key] = {}; m.actions.forEach(a => { p[m.key][a.key] = true; }); });
  return p;
}
// المدير يملك كل الصلاحيات دائمًا بغض النظر عن أي تخصيص مخزَّن.
function getCurrentAccount() {
  if (!currentUser) return null;
  return (DB.staffAccounts || []).find(a => a.id === currentUser.id || (currentUser.username && a.username === currentUser.username)) || null;
}
function can(moduleKey, actionKey) {
  if (!currentUser) return false;
  const account = getCurrentAccount();
  if (!account) return false;
  if (account.status === "موقوف") return false;
  if (account.role === "مدير") return true;
  return !!(account.permissions && account.permissions[moduleKey] && account.permissions[moduleKey][actionKey]);
}
function hasAnySettingsAccess() {
  if (!currentUser) return false;
  const account = getCurrentAccount();
  if (!account) return false;
  if (account.role === "مدير") return true;
  const s = ["edit","backup","restore"].some(a => can("settings", a));
  const sub = ["doctors","employees","categories"].some(k => ["view","add","edit","delete"].some(a => can(k, a)));
  return s || sub;
}

function seedStaffAccounts() {
  return [
    { id: "firebase-admin", username: "admin", password: "", displayName: "مدير النظام", role: "مدير", status: "نشط", createdAt: todayISO(), lastLogin: null, lastPasswordChangeAt: null, securityVersion: 1, firebaseUid: "akvBRlYmxveNlqrSWAbzLlkXIIR2", permissions: fullPermissions() },
  ];
}

let STORAGE_OK = true;

const APP_PREFIX = "mitali_zakat_hospital_";
let STORAGE_MODE = "memory"; // "local" | "memory" | "firestore"
const MEMORY_STORE = {};
const FIRESTORE_ACTIVE_FLAG = APP_PREFIX + "firestore_active";
const FIRESTORE_MIGRATED_FLAG = APP_PREFIX + "firestore_migrated";
function isFirestoreEnabled() {
  try { return localStorage.getItem(FIRESTORE_ACTIVE_FLAG) === "1"; } catch (e) { return false; }
}
function isFirestoreMigrated() {
  try { return localStorage.getItem(FIRESTORE_MIGRATED_FLAG) === "1"; } catch (e) { return false; }
}
function setFirestoreEnabled(enabled) {
  try {
    if (enabled) localStorage.setItem(FIRESTORE_ACTIVE_FLAG, "1");
    else localStorage.removeItem(FIRESTORE_ACTIVE_FLAG);
  } catch (e) { /* ignore */ }
}

// ======================================================================
// طبقة العمل بدون إنترنت (Local-First) — IndexedDB + ذاكرة محلية مؤقتة
// ======================================================================
// المبدأ: القاعدة المحلية (IndexedDB، وبديلها localStorage عند تعذّره) هى
// دائمًا المصدر الفوري لكل قراءة وكتابة. تُحفظ البيانات في Firestore، مع
// استخدام IndexedDB وlocalStorage ككاش محلي مؤقت عند ضعف الاتصال.
const IDB_NAME = APP_PREFIX + "idb";
const IDB_VERSION = 2;
const IDB_STORE_DATA = "tables";     // نسخة محلية كاملة من كل جدول (key = اسم الجدول)
const IDB_STORE_QUEUE = "syncQueue"; // أسماء الجداول التي تحتوي تغييرات لم تُرفَع بعد
const IDB_STORE_CONFLICTS = "conflicts"; // تعارضات بيانات بانتظار قرار المدير (مرحلة ج)
let idbDB = null;
let IDB_OK = false;

function openIDB() {
  return new Promise((resolve) => {
    if (!window.indexedDB) { resolve(null); return; }
    try {
      const req = indexedDB.open(IDB_NAME, IDB_VERSION);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains(IDB_STORE_DATA)) db.createObjectStore(IDB_STORE_DATA);
        if (!db.objectStoreNames.contains(IDB_STORE_QUEUE)) db.createObjectStore(IDB_STORE_QUEUE);
        if (!db.objectStoreNames.contains(IDB_STORE_CONFLICTS)) db.createObjectStore(IDB_STORE_CONFLICTS);
      };
      req.onsuccess = (e) => resolve(e.target.result);
      req.onerror = () => resolve(null);
    } catch (e) { resolve(null); }
  });
}
async function initIDB() {
  if (idbDB || IDB_OK) return; // لا داعى لإعادة الفتح إن كانت جاهزة بالفعل
  idbDB = await openIDB();
  IDB_OK = !!idbDB;
}
function idbRequest(storeName, mode, fn) {
  return new Promise((resolve) => {
    if (!idbDB) { resolve(undefined); return; }
    try {
      const store = idbDB.transaction(storeName, mode).objectStore(storeName);
      const req = fn(store);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => resolve(undefined);
    } catch (e) { resolve(undefined); }
  });
}
const idbGet = (store, key) => idbRequest(store, "readonly", s => s.get(key));
const idbSet = (store, key, value) => idbRequest(store, "readwrite", s => s.put(value, key));
const idbDeleteKey = (store, key) => idbRequest(store, "readwrite", s => s.delete(key));
const idbGetAllKeys = (store) => idbRequest(store, "readonly", s => s.getAllKeys());

// نسخة احتياطية محليًا (localStorage) لأي جهاز لا يدعم IndexedDB
function cacheLocallySync(key, value) {
  try { localStorage.setItem(APP_PREFIX + "cache_" + key, JSON.stringify(value)); } catch (e) { /* ignore */ }
}
async function cacheLocally(key, value) {
  if (IDB_OK) { await idbSet(IDB_STORE_DATA, key, value); return; }
  cacheLocallySync(key, value);
}
async function readLocalCache(key, fallback) {
  if (IDB_OK) {
    const v = await idbGet(IDB_STORE_DATA, key);
    return v !== undefined ? v : fallback;
  }
  try {
    const v = localStorage.getItem(APP_PREFIX + "cache_" + key);
    return v ? JSON.parse(v) : fallback;
  } catch (e) { return fallback; }
}
// "خط الأساس" (Sync Baseline): آخر نسخة من كل جدول كانت معروفة أنها متطابقة
// بين المحلي والسحابي. يُستخدم فقط لمعرفة: (1) هل تغيّر سجل معيّن محليًا فعلًا
// منذ آخر مزامنة (لتفادى وسم كل السجلات بطابع زمنى جديد دون داعٍ)، و(2) هل
// حذف سجل من المصفوفة المحلية هو حذف مقصود أم مجرد سجل لم يصل بعد من جهاز آخر.
async function readSyncBaseline(key) { return await readLocalCache(key + "__base", []); }
async function writeSyncBaseline(key, value) { await cacheLocally(key + "__base", value); }
// Tombstones تحفظ نية الحذف حتى لو لم يكن السجل موجودًا في baseline المحلي
// بسبب جهاز قديم أو لقطة سحابية وصلت بعد إنشاء السجل. بدونها كان diff يعتمد
// على baseline فقط، فيسقط الحذف بينما يستمر رفع الإضافات بشكل طبيعي.
const SYNC_TOMBSTONES_KEY = APP_PREFIX + "sync_tombstones";
async function readSyncTombstones() { return await readLocalCache(SYNC_TOMBSTONES_KEY, {}); }
async function writeSyncTombstones(value) { await cacheLocally(SYNC_TOMBSTONES_KEY, value || {}); }
async function markSyncTombstone(key, id) {
  if (!key || id == null) return;
  const all = await readSyncTombstones();
  const list = Array.isArray(all[key]) ? all[key].map(String) : [];
  const sid = String(id);
  if (!list.includes(sid)) list.push(sid);
  all[key] = list;
  await writeSyncTombstones(all);
}
async function clearSyncTombstones(key, ids) {
  if (!key || !Array.isArray(ids) || !ids.length) return;
  const all = await readSyncTombstones();
  const remove = new Set(ids.map(String));
  const keep = (Array.isArray(all[key]) ? all[key] : []).map(String).filter(id => !remove.has(id));
  if (keep.length) all[key] = keep; else delete all[key];
  await writeSyncTombstones(all);
}
async function protectRemoteSnapshotFromTombstones(key, remoteValue) {
  if (!Array.isArray(remoteValue)) return remoteValue;
  const all = await readSyncTombstones();
  const blocked = new Set((Array.isArray(all[key]) ? all[key] : []).map(String));
  if (!blocked.size) return remoteValue;
  return remoteValue.filter(record => record && !blocked.has(String(record.id)));
}

// Outbox دائم محليًا: IDB_STORE_QUEUE كان مُعرّفًا منذ الإصدار السابق، لكن لم
// يكن هناك مسار يستخدمه. نحفظ اسم الجدول المتعثر فقط لأن أحدث قيمة كاملة موجودة
// بالفعل في IDB_STORE_DATA، وبذلك لا نكرر نسخ بيانات المرضى داخل المتصفح.
const SYNC_QUEUE_LOCAL_KEY = APP_PREFIX + "sync_queue_keys";
const SYNC_QUEUE_KEYS = new Set();
let SYNC_QUEUE_READY = false;
let SYNC_FLUSH_IN_PROGRESS = false;
// حماية من عاصفة إعادة المحاولة عند RESOURCE_EXHAUSTED؛ إبقاء البيانات محليًا
// آمن، لكن إعادة كتابة الجدول كل 30 ثانية تزيد استهلاك الحصة ولا تساعد أثناء الرفض.
let SYNC_RETRY_BLOCKED_UNTIL = 0;
let SYNC_RETRY_REASON = "";
const SYNC_RETRY_STATE_KEY = APP_PREFIX + "sync_retry_state";
const FIRESTORE_QUOTA_BACKOFF_MS = 15 * 60 * 1000;
function loadSyncRetryState() {
  try {
    const raw = localStorage.getItem(SYNC_RETRY_STATE_KEY);
    const state = raw ? JSON.parse(raw) : null;
    if (state && Number(state.blockedUntil) > Date.now()) {
      SYNC_RETRY_BLOCKED_UNTIL = Number(state.blockedUntil);
      SYNC_RETRY_REASON = String(state.reason || "");
    } else if (raw) localStorage.removeItem(SYNC_RETRY_STATE_KEY);
  } catch (e) { /* لا نمنع التشغيل بسبب فشل كاش حالة الحظر */ }
}
function persistSyncRetryState() {
  try {
    if (SYNC_RETRY_BLOCKED_UNTIL > Date.now()) localStorage.setItem(SYNC_RETRY_STATE_KEY, JSON.stringify({ blockedUntil: SYNC_RETRY_BLOCKED_UNTIL, reason: SYNC_RETRY_REASON }));
    else localStorage.removeItem(SYNC_RETRY_STATE_KEY);
  } catch (e) { /* ignore */ }
}
function isFirestoreQuotaError(error) {
  const code = String(error && (error.code || error.status || "")).toLowerCase();
  const message = String(error && error.message || "").toLowerCase();
  return code === "8" || code.includes("resource-exhausted") || code.includes("quota")
    || message.includes("resource exhausted") || message.includes("quota exceeded");
}
function noteFirestoreQuotaError(error) {
  if (!isFirestoreQuotaError(error)) return;
  SYNC_RETRY_BLOCKED_UNTIL = Math.max(SYNC_RETRY_BLOCKED_UNTIL, Date.now() + FIRESTORE_QUOTA_BACKOFF_MS);
  SYNC_RETRY_REASON = String(error && (error.code || error.message) || "resource-exhausted");
  persistSyncRetryState();
}
function clearFirestoreQuotaBackoff() {
  SYNC_RETRY_BLOCKED_UNTIL = 0;
  SYNC_RETRY_REASON = "";
  persistSyncRetryState();
}
async function loadSyncQueueState() {
  if (SYNC_QUEUE_READY) return;
  loadSyncRetryState();
  try {
    if (IDB_OK) {
      const keys = await idbGetAllKeys(IDB_STORE_QUEUE);
      (keys || []).forEach(key => SYNC_QUEUE_KEYS.add(String(key)));
    } else {
      const raw = localStorage.getItem(SYNC_QUEUE_LOCAL_KEY);
      const keys = raw ? JSON.parse(raw) : [];
      (Array.isArray(keys) ? keys : []).forEach(key => SYNC_QUEUE_KEYS.add(String(key)));
    }
  } catch (e) { /* الكاش المحلي يظل صالحًا حتى لو تعذر فتح قائمة الانتظار */ }
  SYNC_QUEUE_READY = true;
}
async function persistSyncQueueFallback() {
  if (IDB_OK) return;
  try { localStorage.setItem(SYNC_QUEUE_LOCAL_KEY, JSON.stringify([...SYNC_QUEUE_KEYS])); } catch (e) { /* ignore */ }
}
async function markSyncPending(key) {
  await loadSyncQueueState();
  const name = String(key || "");
  if (!name) return;
  SYNC_QUEUE_KEYS.add(name);
  try {
    if (IDB_OK) await idbSet(IDB_STORE_QUEUE, name, { key: name, queuedAt: nowISO() });
    else await persistSyncQueueFallback();
  } catch (e) { /* لا نمنع الحفظ المحلي بسبب فشل تحديث مؤشر الطابور */ }
  renderStorageIndicator();
}
async function clearSyncPending(key) {
  await loadSyncQueueState();
  const name = String(key || "");
  if (!name || !SYNC_QUEUE_KEYS.delete(name)) return;
  try {
    if (IDB_OK) await idbDeleteKey(IDB_STORE_QUEUE, name);
    else await persistSyncQueueFallback();
  } catch (e) { /* يبقى المفتاح في الذاكرة ويُعاد التعامل معه في الجلسة التالية */ }
  renderStorageIndicator();
}
async function flushSyncQueue() {
  await loadSyncQueueState();
  if (SYNC_RETRY_BLOCKED_UNTIL > Date.now()) {
    renderStorageIndicator();
    return;
  }
  if (SYNC_RETRY_BLOCKED_UNTIL && SYNC_RETRY_BLOCKED_UNTIL <= Date.now()) clearFirestoreQuotaBackoff();
  if (SYNC_FLUSH_IN_PROGRESS || !navigator.onLine || STORAGE_MODE !== "firestore" || !currentUser || !SYNC_QUEUE_KEYS.size) {
    renderStorageIndicator();
    return;
  }
  SYNC_FLUSH_IN_PROGRESS = true;
  try {
    for (const key of [...SYNC_QUEUE_KEYS]) {
      if (!navigator.onLine || !currentUser) break;
      const latest = await readLocalCache(key, undefined);
      if (latest === undefined) { await clearSyncPending(key); continue; }
      try {
        await storeSet(key, latest);
        await clearSyncPending(key);
      } catch (e) {
        // لا نمسح القيمة المحلية. عند امتلاء الحصة نوقف إعادة المحاولة مؤقتًا
        // بدل إرسال نفس الكتابة كل 30 ثانية وإطالة فترة الرفض.
        noteFirestoreQuotaError(e);
        break;
      }
    }
  } finally {
    SYNC_FLUSH_IN_PROGRESS = false;
    renderStorageIndicator();
  }
}

function stripUpdatedAt(o) { const c = Object.assign({}, o); delete c.updatedAt; return c; }
function recordsEqual(a, b) {
  if (!a || !b) return false;
  return JSON.stringify(stripUpdatedAt(a)) === JSON.stringify(stripUpdatedAt(b));
}
function stableSyncValue(value) {
  if (Array.isArray(value)) return value.map(stableSyncValue);
  if (value && typeof value === "object") {
    return Object.keys(value).sort().reduce((out, k) => { out[k] = stableSyncValue(value[k]); return out; }, {});
  }
  return value;
}
function syncDateOnly(value) {
  if (!value) return null;
  const s = String(value);
  const m = s.match(/^\d{4}-\d{2}-\d{2}/);
  return m ? m[0] : s;
}
function syncTimestamp(value) {
  if (!value) return null;
  const ms = Date.parse(value);
  return Number.isNaN(ms) ? String(value) : new Date(ms).toISOString();
}
function syncRecordsEqual(key, a, b) {
  if (!a || !b) return false;
  const left = {}; const right = {};
  const fields = new Set([...Object.keys(a), ...Object.keys(b)]);
  for (const field of fields) {
    // updated_at/created_at الخاص بسجل النشاط طوابع خادم لا تمثل اختلاف محتوى.
    if (field === "updatedAt" || (key === "auditLog" && field === "timestamp")) continue;
    let lv = a[field]; let rv = b[field];
    if (key === "staffAccounts" && field === "createdAt") { lv = syncDateOnly(lv); rv = syncDateOnly(rv); }
    if (key === "staffAccounts" && field === "lastLogin") { lv = syncTimestamp(lv); rv = syncTimestamp(rv); }
    left[field] = stableSyncValue(lv);
    right[field] = stableSyncValue(rv);
  }
  return JSON.stringify(left) === JSON.stringify(right);
}

// تعارضات بانتظار مراجعة يدوية من المدير (تُستخدم فقط إذا كان خيار
// "مراجعة التعارضات يدويًا" مُفعّلًا فى الإعدادات)
async function stashConflicts(conflicts) {
  for (const cft of conflicts) {
    const ck = cft.table + ":" + cft.id;
    if (IDB_OK) { await idbSet(IDB_STORE_CONFLICTS, ck, cft); continue; }
    try {
      const raw = localStorage.getItem(APP_PREFIX + "conflicts");
      const map = raw ? JSON.parse(raw) : {};
      map[ck] = cft;
      localStorage.setItem(APP_PREFIX + "conflicts", JSON.stringify(map));
    } catch (e) { /* ignore */ }
  }
}
async function getAllConflicts() {
  if (IDB_OK) {
    const keys = await idbGetAllKeys(IDB_STORE_CONFLICTS);
    const list = [];
    for (const k of (keys || [])) { const v = await idbGet(IDB_STORE_CONFLICTS, k); if (v) list.push(v); }
    return list;
  }
  try {
    const raw = localStorage.getItem(APP_PREFIX + "conflicts");
    return raw ? Object.values(JSON.parse(raw)) : [];
  } catch (e) { return []; }
}
async function removeConflict(table, id) {
  const ck = table + ":" + id;
  if (IDB_OK) { await idbDeleteKey(IDB_STORE_CONFLICTS, ck); return; }
  try {
    const raw = localStorage.getItem(APP_PREFIX + "conflicts");
    const map = raw ? JSON.parse(raw) : {};
    delete map[ck];
    localStorage.setItem(APP_PREFIX + "conflicts", JSON.stringify(map));
  } catch (e) { /* ignore */ }
}
// المدير يختار الفائز فى تعارض بيانات: "local" (الجهاز الحالى) أو "remote" (السحابة)
async function resolveConflict(table, id, winner) {
  const conflicts = await getAllConflicts();
  const cft = conflicts.find(c => c.table === table && c.id === id);
  if (!cft) return;
  const chosen = Object.assign({}, winner === "local" ? cft.local : cft.remote);
  chosen.updatedAt = nowISO(); // طابع زمنى جديد كى يفوز فى أى مقارنة قادمة
  const arr = DB[table];
  if (Array.isArray(arr)) {
    const idx = arr.findIndex(r => r.id === id);
    if (idx > -1) arr[idx] = chosen; else arr.push(chosen);
  }
  await removeConflict(table, id);
  logActivity("حل تعارض بيانات (" + (winner === "local" ? "اعتماد النسخة المحلية" : "اعتماد النسخة البعيدة") + ")", "settings");
  persist(table);
}

async function detectStorageMode() {
  await initIDB();
  await loadSyncQueueState();
  if (window.MitaliFirebase) {
    try {
      await window.MitaliFirebase.init();
      const firebaseUser = await window.MitaliFirebase.waitForAuth();
      if (firebaseUser) {
        STORAGE_MODE = "firestore";
        try {
          localStorage.setItem(FIRESTORE_ACTIVE_FLAG, "1");
          localStorage.setItem(FIRESTORE_MIGRATED_FLAG, "1");
        } catch (e) { /* ignore */ }
        return;
      }
    } catch (e) {
      console.warn("Firestore unavailable; using local cache until login:", e);
    }
  }
  STORAGE_MODE = "local";
}



async function storeGet(key, fallback, options = {}) {
  try {
    if (STORAGE_MODE === "firestore" && window.MitaliFirebase) {
      const cached = await readLocalCache(key, undefined);
      if (options.preferCache && cached !== undefined) {
        // إعادة التحميل لا تنتظر الشبكة إذا كانت نسخة محلية سليمة موجودة؛
        // loadAll() اللاحق سيجلب أحدث نسخة ويعيد الرسم بعد اكتمالها.
        return cached;
      }
      try {
        const remote = await window.MitaliFirebase.getValue(key, fallback, options.requireServer ? { source: "server" } : {});
        if (remote !== undefined && remote !== null) {
          const tombstoneProtectedRemote = Array.isArray(remote) ? await protectRemoteSnapshotFromTombstones(key, remote) : remote;
          const safeRemote = Array.isArray(tombstoneProtectedRemote) ? mergeRemoteSnapshot(key, tombstoneProtectedRemote) : tombstoneProtectedRemote;
          await cacheLocally(key, safeRemote);
          // إذا كان الجدول داخل outbox، فقد تحتوي safeRemote على سجل محلي
          // محفوظ مؤقتًا لحمايته من لقطة سحابية أقدم. لا نضع هذه اللقطة في
          // baseline، وإلا سيُعتبر السجل غير المرفوع مؤكدًا ولن يرفعه flush لاحقًا.
          if (Array.isArray(safeRemote) && !SYNC_QUEUE_KEYS.has(String(key))) await writeSyncBaseline(key, safeRemote);
          return safeRemote;
        }
      } catch (e) {
        noteFirestoreQuotaError(e);
        console.warn("Firestore read failed; using local cache:", key, e);
        if (options.requireServer) throw e;
      }
      return cached !== undefined ? cached : fallback;
    }
    if (STORAGE_MODE === "local") {
      const v = localStorage.getItem(APP_PREFIX + key);
      return v ? JSON.parse(v) : fallback;
    }
    return key in MEMORY_STORE ? MEMORY_STORE[key] : fallback;
  } catch (e) {
    return fallback;
  }
}

// إصلاح جوهري (السبب الحقيقي وراء "اختفاء" الزيارة الثانية عند التسجيل السريع
// وأنت متصل بالإنترنت تحديدًا): كان storeSet لجدول واحد يمكن أن يُستدعى مرتين
// متتاليتين بسرعة (زيارة، ثم زيارة تانية بعدها بثوانٍ) بدون أى تسلسل - فيبدأ
// رفعان متزامنان لنفس الجدول للسحابة، وكل واحد منهم فى النهاية ينفّذ
// `DB[key] = merged` بالنتيجة اللى وصلها. لو الرفع الأول (اللي بدأ ببيانات
// الزيارة الأولى فقط) انتهى مؤخرًا (بعد الرفع الثانى اللى بدأ لاحقًا وبيانته
// أحدث)، كانت نتيجته القديمة تكتب فوق `DB[key]` وتمحو الزيارة الثانية من
// الذاكرة المحلية تمامًا - رغم إنها اتسجّلت فعلاً للحظة. هذا لا يحدث أوفلاين
// لأن الوضع الأوفلاين لا يعيد تعيين DB[key] من نتيجة دمج أصلًا (سطر ٤٧٧ تحت).
// الحل: طابور تنفيذ منفصل لكل جدول - أى استدعاء storeSet لجدول معيّن ينتظر
// اكتمال الاستدعاء السابق لنفس الجدول قبل ما يبدأ، فلا يحدث تسابق بينهم أبدًا،
// ويبقى ترتيب الكتابة النهائية مطابقًا لترتيب الحفظ الفعلى دايمًا.
const STORE_SET_QUEUES = {};
function storeSet(key, value) {
  const prev = STORE_SET_QUEUES[key] || Promise.resolve();
  const run = prev.catch(() => {}).then(() => storeSetInner(key, value));
  STORE_SET_QUEUES[key] = run;
  return run;
}
async function storeSetInner(key, value) {
  try {
    if (STORAGE_MODE === "firestore" && window.MitaliFirebase) {
      await cacheLocally(key, value);
      if (!navigator.onLine || SYNC_RETRY_BLOCKED_UNTIL > Date.now()) {
        await markSyncPending(key);
        renderStorageIndicator();
        return;
      }
      if (Array.isArray(value) && !["settings", "categories", "specialties"].includes(key) && window.MitaliFirebase.upsertRecords) {
        const previous = await readSyncBaseline(key);
        const previousMap = new Map((previous || []).filter(r => r && r.id != null).map(r => [String(r.id), r]));
        const nextMap = new Map(value.filter(r => r && r.id != null).map(r => [String(r.id), r]));
        const tombstones = await readSyncTombstones();
        const explicitDeleted = (Array.isArray(tombstones[key]) ? tombstones[key] : []).map(String).filter(id => !nextMap.has(id));
        const changed = value.filter(r => r && r.id != null && (!previousMap.has(String(r.id)) || !syncRecordsEqual(key, previousMap.get(String(r.id)), r)));
        const deleted = [...new Set([
          ...(previous || []).filter(r => r && r.id != null && !nextMap.has(String(r.id))).map(r => String(r.id)),
          ...explicitDeleted,
        ])];
        if (changed.length) await window.MitaliFirebase.upsertRecords(key, changed);
        if (deleted.length && window.MitaliFirebase.deleteRecords) await window.MitaliFirebase.deleteRecords(key, deleted);
        if (explicitDeleted.length) await clearSyncTombstones(key, explicitDeleted);
      } else {
        await window.MitaliFirebase.setValue(key, value);
      }
      // إدارة users وstaff_accounts الحساسة تتم عبر /api/admin/account فقط.
      // لا نعيد كتابة users لكل الحسابات عند كل حفظ محلي؛ فهذا يضاعف الكتابات
      // وقد يخالف قواعد Firestore ويستنزف الحصة دون حاجة.
      if (navigator.onLine) {
        if (Array.isArray(value)) await writeSyncBaseline(key, value);
        await clearSyncPending(key);
        if (!SYNC_QUEUE_KEYS.size) clearFirestoreQuotaBackoff();
      } else {
        await markSyncPending(key);
      }
      renderStorageIndicator();
      return;
    }
    if (STORAGE_MODE === "local") {
      localStorage.setItem(APP_PREFIX + key, JSON.stringify(value));
    } else {
      MEMORY_STORE[key] = value;
    }
    renderStorageIndicator();
  } catch (e) {
    if (STORAGE_MODE === "firestore") {
      noteFirestoreQuotaError(e);
      await markSyncPending(key);
    }
    STORAGE_OK = false;
    throw e;
  }
}

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
// يحوّل تاريخ الجهاز المحلي إلى صيغة "YYYY-MM-DD" بدون الانزلاق يومًا للخلف/للأمام
// بسبب فارق التوقيت (كان الكود القديم يستخدم toISOString() مباشرة، وهى تعتمد
// توقيت UTC، فكانت التواريخ تُسجَّل بتاريخ الأمس خلال ساعات الفجر الأولى محليًا).
function localISO(d) {
  const tzOffsetMs = d.getTimezoneOffset() * 60000;
  return new Date(d.getTime() - tzOffsetMs).toISOString().slice(0, 10);
}
function todayISO() { return localISO(new Date()); }
function nowISO() { return new Date().toISOString(); }
const AR_MONTH_NAMES = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
function monthLabel(ym) {
  const [y, m] = (ym || "").split("-");
  const idx = Number(m) - 1;
  return (AR_MONTH_NAMES[idx] || ym) + " " + (y || "");
}
// يبنى قائمة الشهور المتاحة لقائمة منسدلة (الأحدث أولًا)، ويضمن وجود الشهر الحالى
// دائمًا حتى لو لم يُسجَّل فيه شيء بعد - بما يحقق مبدأ "بداية كل شهر نبدأ من جديد"
function buildMonthOptions(dates) {
  const set = new Set((dates || []).filter(Boolean).map(d => String(d).slice(0, 7)));
  set.add(todayISO().slice(0, 7));
  return Array.from(set).sort((a, b) => b.localeCompare(a));
}
// يبنى قائمة السنوات المتاحة لقائمة منسدلة (الأحدث أولًا)، ويضمن وجود السنة الحالية دائمًا
function buildYearOptions(dates) {
  const set = new Set((dates || []).filter(Boolean).map(d => String(d).slice(0, 4)));
  set.add(todayISO().slice(0, 4));
  return Array.from(set).sort((a, b) => b.localeCompare(a));
}
// فلتر عام بالفترة (يوم / شهر / سنة / الكل) يُستخدم فى أكثر من صفحة (سجل الزيارات، قائمة المرضى)
// الافتراضى دائمًا: عرض الشهر الحالى
// إصلاح: كانت هذه الشاشات الثلاث (يومية العيادات، يومية الأسنان، ملفات المرضى)
// تُفلتَر افتراضيًا على "الشهر الحالى" فقط بمجرد فتح الصفحة - فأى زيارة أو مريض
// أقدم من الشهر الحالى (مثل أول مريض تم تسجيله، أو أي بيانات تاريخية) يختفي من
// العرض تمامًا دون حذف فعلى، وهو ما بدا وكأنه "سجل مفقود" أو خطأ فى الحفظ رغم
// إن البيانات كانت سليمة طوال الوقت. الافتراضى الآن "الكل" - تظهر كل السجلات

function ensurePeriodFilter(granKey, valKey) {

function fmt(n) { return (Number(n) || 0).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
// توحيد الأرقام: يحوّل أي أرقام عربية-هندية (٠١٢٣٤٥٦٧٨٩) أو فارسية (۰۱۲۳۴۵۶۷۸۹)
// إلى أرقام إنجليزية عادية. الأرقام المولَّدة داخليًا (fmt/fmtInt) كانت أصلًا
// دائمًا إنجليزية (toLocaleString("en-US") لا يتأثر بلغة الجهاز)، لكن حقول
// الإدخال من نوع number كانت تُعرض بأرقام عربية-هندية تلقائيًا على الأجهزة التي
// لغة نظامها عربية (سلوك متصفح/نظام أصلي لا يمكن تجاوزه عبر CSS أو JS على حقل
// type="text" inputmode="decimal" نفسه) - لذلك حُوِّلت كل حقول الأرقام فى النظام إلى نص عادي
// (inputmode="decimal") مع تطبيع فوري لأي رقم عربي-هندي يُكتب فيها.
const ARABIC_INDIC_DIGITS = "٠١٢٣٤٥٦٧٨٩";

function toEnglishDigits(str) {
  if (str === null || str === undefined) return str;
  return String(str).replace(/[٠-٩۰-۹]/g, ch => {
    const ai = ARABIC_INDIC_DIGITS.indexOf(ch);
    if (ai > -1) return String(ai);
    const pi = PERSIAN_DIGITS.indexOf(ch);
    if (pi > -1) return String(pi);
    return ch;
  });
}
document.addEventListener("input", e => {
  const el = e.target;
  if (el && el.tagName === "INPUT" && (el.inputMode === "decimal" || el.inputMode === "numeric")) {
    let normalized = toEnglishDigits(el.value);
    // اسمح بالأرقام ونقطة عشرية واحدة فقط (نفس قيود type="number" الأصلية) -
    // يمنع كتابة حروف أو رموز عن طريق الخطأ الآن بعد التحويل لحقل نصي عادي.
    normalized = normalized.replace(/[^0-9.]/g, "");
    const firstDot = normalized.indexOf(".");
    if (firstDot !== -1) normalized = normalized.slice(0, firstDot + 1) + normalized.slice(firstDot + 1).replace(/\./g, "");
    if (normalized !== el.value) {
      const pos = el.selectionStart - (el.value.length - normalized.length);
      el.value = normalized;
      try { el.setSelectionRange(pos, pos); } catch (e2) { /* ignore */ }
    }
  }
}, true);

function relDate(daysAgo) { const d = new Date(); d.setDate(d.getDate() - daysAgo); return localISO(d); }

// ---- مولّد بيانات تجريبية واقعية تغطى سنة كاملة (~365 يومًا) لاختبار النظام ----
// PRNG بذرة ثابتة (mulberry32) بدلًا من Math.random() حتى تكون نفس البيانات
// التجريبية قابلة لإعادة التوليد بشكل ثابت فى كل مرة يُفتح فيها النظام لأول مرة.
function _mulberry32(seed) {

  };

const _seedRng = _mulberry32(20260101);

const TEST_DATA_DAYS = 365; // سنة كاملة

const _MALE_FIRST = ["أحمد","محمد","خالد","عمر","محمود","يوسف","كريم","طارق","حسام","هشام","عادل","سيف","إبراهيم","وليد"];
const _FEMALE_FIRST = ["منى","سارة","هبة","إيمان","نور","داليا","رشا","سلمى","ياسمين","رنا","نهى","مريم","دعاء","أمل"];
const _LAST_NAMES = ["علي","سعيد","فتحي","حسن","كامل","رضا","طه","يوسف","إبراهيم","عبد الله","فؤاد","سليمان","النجار","حماد"];

  const first = _rnd() < 0.5 ? _pick(_MALE_FIRST) : _pick(_FEMALE_FIRST);
  return `${first} ${_pick(_LAST_NAMES)}`;
}
function _randomPhone() { return "010" + _rndInt(10000000, 99999999); }

function seedVisitsClinic(doctors) {
  const specialists = doctors.filter(d => d.type === "عيادات" && d.status === "نشط");
  if (!specialists.length) return [];
  const examTypes = ["كشف","كشف","كشف","استشارة","متابعة"]; // "كشف" أكثر شيوعًا
  const feesByType = { "كشف": [120,150,180,200], "استشارة": [200,250,300], "متابعة": [0] };
  const rows = [];
  let fileSeq = 3001;
  for (let day = TEST_DATA_DAYS - 1; day >= 0; day--) {
    const date = relDate(day);
    const weekday = new Date(date).getDay(); // 5 = الجمعة (عطلة غالبًا)
    if (weekday === 5) continue;
    if (_rnd() < 0.12) continue; // يوم هادئ بدون زيارات
    const visitsToday = _rndInt(1, 5);
    for (let k = 0; k < visitsToday; k++) {
      const doc = _pick(specialists);
      const examType = _pick(examTypes);
      const total = _pick(feesByType[examType]);
      let paid, status;
      if (total === 0) { paid = 0; status = "تم"; }
      else {
        const r = _rnd();
        if (r < 0.72) { paid = total; status = "تم"; }
        else if (r < 0.92) { paid = Math.round(total * _pick([0.3,0.4,0.5,0.6]) / 10) * 10; status = "جزئي"; }
        else { paid = 0; status = "مؤجل"; }
      }
      rows.push({
        id: uid(), date, fileNo: String(fileSeq++), patient: _randomPatientName(), phone: _randomPhone(),
        doctorId: doc.id, examType, xray: 0, lab: 0, services: total, total, paid,
        paymentMethod: _pick(LISTS.payMethods.slice(0, 3)), status, notes: "",
      });
    }
  }
  return rows;
}

async function loadAll(options = {}) {
  await detectStorageMode();
  const readTable = (key, fallback) => storeGet(key, fallback, { preferCache: !!options.preferCache });
  // كل هذه المفاتيح مستقلة عن بعضها فى القراءة (لا يعتمد أى منها على نتيجة الآخر)،
  // لذلك نجلبها جميعًا بالتوازى بدلًا من واحد تلو الآخر. هذا هو السبب الرئيسى فى
  // بطء تسجيل الدخول سابقًا: كانت كل عملية قراءة (خصوصًا مع Firestore عبر الشبكة)
  // تنتظر انتهاء التى قبلها، فيتراكم زمن الانتظار بدل أن يحدث معًا فى نفس الوقت.
  const [
    doctorsRaw, employeesRaw, visitsClinicRaw, visitsDentalRaw, visitsOperationsRaw, visitsLabsRaw, visitsRadiologyRaw, incomeRaw, expenseRaw, payrollRaw,
    settingsRaw, staffAccountsRaw, categoriesRaw, specialtiesRaw, auditLogRaw, labExpensesRaw,
  ] = await Promise.all([
    readTable("doctors", null),
    readTable("employees", null),
    readTable("visitsClinic", null),
    readTable("visitsDental", null),
    readTable("visitsOperations", null),
    readTable("visitsLabs", null),
    readTable("visitsRadiology", null),
    readTable("income", null),
    readTable("expense", null),
    readTable("payroll", null),
    readTable("settings", { openingBalance: 10000 }),
    readTable("staffAccounts", null),
    readTable("categories", null),
    readTable("specialties", null),
    readTable("auditLog", []),
    readTable("labExpenses", []),
  ]);

  const isFirstRun = !doctorsRaw || doctorsRaw.length === 0;
  const or = (val, fallback) => (val && val.length) ? val : fallback;
  DB.doctors = or(doctorsRaw, seedDoctors());
  DB.employees = or(employeesRaw, seedEmployees());
  DB.visitsClinic = or(visitsClinicRaw, isFirstRun ? seedVisitsClinic(DB.doctors) : []);
  DB.visitsDental = or(visitsDentalRaw, isFirstRun ? seedVisitsDental(DB.doctors) : []);

  if (mode === "fixed_visit") {
    const hasSnapshot = visit.clinicFeeSnapshot !== undefined && visit.clinicFeeSnapshot !== null;
    const clinicFee = hasSnapshot ? Number(visit.clinicFeeSnapshot)
      : (visit.examType === "متابعة" ? Number(d.followupClinicFee) || 0 : Number(d.checkupClinicFee) || 0);
    const clinicShare = Math.min(Math.max(clinicFee, 0), paid);
    return { doc: paid - clinicShare, clinic: clinicShare };
  }
  // percent (الأسنان دايمًا، أو أى طبيب عيادات مازال يستخدم النظام القديم بالنسبة)
  // ملحوظة: زيارات "متابعة" كانت تُستبعد بالكامل من حساب النسبة (تُعتبر مجانية)،
  // لكن بناءً على طلب صريح تم إلغاء هذا الاستبعاد - أى زيارة "متابعة" الآن تُحسب
  // بنفس نسبة الطبيب/المجمع تمامًا مثل "كشف"، لأنها قد تحمل مبالغ حقيقية مدفوعة.

// إصلاح محاسبي: أصبح بإمكان المستخدم إدخال حصة الطبيب وحصة المجمع يدويًا لكل
// قيد من هذا النوع (بدل التخمين التلقائي غير الدقيق لأطباء "مبلغ ثابت لكل
// زيارة") - فهذه القيم المحفوظة (rec.docShare/rec.clinicShare) هى المصدر الأول
// دومًا إن وُجدت. القيود القديمة (المسجَّلة قبل إضافة هذه الميزة) بلا هذه القيم
// تتساقط على الحساب الاحتياطى التلقائى القديم كما كان (نسبة، أو الكل للمجمع
// لأطباء المبلغ الثابت/الأجر اليومي) حفاظًا على التوافق.
function incomeDoctorShare(rec) {
  if (!rec || !rec.doctorId) return { doc: 0, clinic: 0 };
  if (rec.docShare !== undefined && rec.docShare !== null && rec.clinicShare !== undefined && rec.clinicShare !== null) {
    return { doc: Number(rec.docShare) || 0, clinic: Number(rec.clinicShare) || 0 };

  const d = dInfo(rec.doctorId);
  if (!d) return { doc: 0, clinic: 0 };
  const amt = Number(rec.amount) || 0;
  const mode = d.type === "أسنان" ? "percent" : (d.feeMode || "fixed_visit");
  if (mode === "fixed_visit" || mode === "fixed_daily") return { doc: 0, clinic: amt };

// حساب الإيرادات حسب فترة مختارة (اليوم/الأسبوع/الشهر/السنة) لقائمة لوحة القيادة المنسدلة

function startOfWeekISO() {
  const now = new Date();
  const start = new Date(now);

}
function periodRevenue(period) {
  const visits = allVisits();
  // قيود الوارد المرتبطة بطبيب (إجمالي يومي بديل) تُحتسَب هنا أيضًا حتى لا يقل
  // الإجمالي المعروض عن الحقيقة لو استُخدمت طريقة "التحصيل الإجمالي" بدل تسجيل
  // كل مريض على حدة.
  const lumpIncome = DB.income.filter(r => r.doctorId);
  const t = todayISO();
  let matches, lumpMatches;
  if (period === "week") {
    const start = startOfWeekISO();
    matches = visits.filter(v => v.date >= start && v.date <= t);
    lumpMatches = lumpIncome.filter(r => r.date >= start && r.date <= t);
  } else if (period === "month") {
    matches = visits.filter(v => (v.date || "").slice(0, 7) === t.slice(0, 7));
    lumpMatches = lumpIncome.filter(r => (r.date || "").slice(0, 7) === t.slice(0, 7));
  } else if (period === "year") {
    matches = visits.filter(v => (v.date || "").slice(0, 4) === t.slice(0, 4));
    lumpMatches = lumpIncome.filter(r => (r.date || "").slice(0, 4) === t.slice(0, 4));
  } else {
    matches = visits.filter(v => v.date === t);
    lumpMatches = lumpIncome.filter(r => r.date === t);
  }
  const total = matches.reduce((s, v) => s + (Number(v.paid) || 0), 0) + lumpMatches.reduce((s, r) => s + (Number(r.amount) || 0), 0);

}

function doctorRevenue(doctorId) {
  if (!doctorId) return { count: 0, total: 0, share: 0 };
  const visits = allVisits().filter(v => v.doctorId === doctorId);
  const lumpIncome = DB.income.filter(r => r.doctorId === doctorId);
  const total = visits.reduce((s, v) => s + (Number(v.paid) || 0), 0) + lumpIncome.reduce((s, r) => s + (Number(r.amount) || 0), 0);
  const share = visits.reduce((s, v) => s + computeShare(v).doc, 0) + lumpIncome.reduce((s, r) => s + incomeDoctorShare(r).doc, 0);
  return { count: visits.length + lumpIncome.length, total, share };
}

// ======================================================================
// يرتّب أي قائمة سجلات تنازليًا حسب وقت إدخالها الفعلى فى النظام (createdAt)،
// بغض النظر تمامًا عن تاريخ العملية نفسها أو رقم الملف أو المبلغ. سجل له
// createdAt يُعتبر دائمًا أحدث من سجل بلا createdAt (بيانات قديمة سابقة على
// إضافة هذه الميزة) لأن أي createdAt بالتعريف أُنشئ بعد نشر هذا الإصلاح. لو
// كلا السجلين بلا createdAt (بيانات قديمة كلها)، نستخدم أفضل تقريب متاح: تاريخ
// العملية، ثم ترتيب الإدخال الأصلى فى المصفوفة - نفس المنطق القديم قبل هذا
// الإصلاح، فلا ينكسر شيء فى البيانات القديمة.
function sortByEntryOrderDesc(list, legacyDateKeyFn) {
  const keyFn = legacyDateKeyFn || (x => x.date || "");
  return list.map((item, i) => ({ item, i })).sort((a, b) => {
    const aTs = a.item.createdAt, bTs = b.item.createdAt;
    if (aTs && bTs) return bTs.localeCompare(aTs);
    if (aTs && !bTs) return -1;
    if (!aTs && bTs) return 1;
    const byDate = keyFn(b.item).localeCompare(keyFn(a.item));
    return byDate !== 0 ? byDate : b.i - a.i;
  }).map(({ item }) => item);
}

function groupPatients(visits) {

  visits.forEach(v => {
    const key = patientKey(v);
    if (!map.has(key)) map.set(key, { key, name: "", phone: "", fileNos: new Set(), visits: [] });
    const g = map.get(key);
    if (v.fileNo) g.fileNos.add(v.fileNo);
    if (!g.name && v.patient) g.name = v.patient;
    if (!g.phone && v.phone) g.phone = v.phone;
    g.visits.push(v);
  });
  const today = todayISO();
  return Array.from(map.values()).map(g => {
    const sorted = sortByEntryOrderDesc(g.visits);
    const totalPaid = g.visits.reduce((s, v) => s + (Number(v.paid) || 0), 0);
    const totalDue = g.visits.reduce((s, v) => s + visitRemaining(v), 0);
    const upcoming = g.visits.filter(v => v.nextVisitDate && v.nextVisitDate >= today).sort((a, b) => (a.nextVisitDate || "").localeCompare(b.nextVisitDate || ""));
    return { ...g, fileNos: Array.from(g.fileNos), visits: sorted, totalPaid, totalDue, lastVisit: sorted[0] || null, nextFollowUp: upcoming[0] || null };
  });
}

function ledgerRows() {

  // ملحوظة: هذا الترتيب الزمني التصاعدى (بالتاريخ الفعلى للعملية) ضرورى وثابت
  // ولا يتغيّر - لازم لحساب الرصيد التراكمى الصحيح لحظة بلحظة. ترتيب العرض
  // "الأحدث إدخالًا" يُطبَّق بعد كده على العرض فقط (فى renderLedger) دون المساس

let manualDataReloadInProgress = false;
async function reloadLatestDataNow() {

  manualDataReloadInProgress = true;
  if (button) { button.disabled = true; button.innerHTML = "⟳ <span>تحميل...</span>"; }
  renderStorageIndicator();
  try {
    await loadKeys(pageKeys(state.page), { preferCache: false, requireServer: true });
    pageKeys(state.page).forEach(key => { PAGE_DATA_LOADED_AT[key] = Date.now(); });
    subscribeFirestoreRealtime();
    if (currentUser && !isMidEdit() && !isUserActivelyTyping()) route();
    showToast("تم تحميل أحدث البيانات من Firebase");
  } catch (error) {
    console.error("Manual Firebase reload failed:", error);
    showToast("⚠️ تعذر تحميل أحدث البيانات — احتفظ بالنسخة المحلية وحاول مرة أخرى");
  } finally {

    renderStorageIndicator();
  }
}
let DESKTOP_UPDATE_STATE = { status: "idle", version: null, percent: 0, error: null };
let DESKTOP_UPDATE_UI_READY = false;
function desktopUpdateLabel(state) {
  if (!state) return "";
  if (state.status === "checking") return "جارٍ فحص التحديث...";
  if (state.status === "available") return `يتوفر تحديث ${esc(state.version || "جديد")}`;
  if (state.status === "downloading") return `جارٍ تنزيل التحديث ${Math.round(Number(state.percent || 0))}%`;
  if (state.status === "downloaded") return `التحديث ${esc(state.version || "الجديد")} جاهز للتثبيت`;
  if (state.status === "error") return "تعذر فحص التحديث";
  return "";
}
function renderDesktopUpdateIndicator() {
  const el = document.getElementById("desktopUpdateIndicator");
  if (!el || !window.MitaliDesktop?.isDesktop) return;
  const state = DESKTOP_UPDATE_STATE || {};
  const visible = ["available", "downloading", "downloaded", "error"].includes(state.status);
  el.hidden = !visible;
  if (!visible) { el.innerHTML = ""; return; }
  const action = state.status === "available" ? `<button type="button" id="desktopUpdateAction" class="btn ghost sm">تنزيل</button>`
    : state.status === "downloaded" ? `<button type="button" id="desktopUpdateAction" class="btn sm">إعادة التشغيل والتثبيت</button>`
    : state.status === "error" ? `<button type="button" id="desktopUpdateAction" class="btn ghost sm">إعادة الفحص</button>` : "";
  el.innerHTML = `<span>${desktopUpdateLabel(state)}</span>${action}`;
  const button = document.getElementById("desktopUpdateAction");
  if (button) button.addEventListener("click", async () => {
    button.disabled = true;
    try {
      if (state.status === "available") await window.MitaliDesktop.downloadUpdate();
      else if (state.status === "error") await window.MitaliDesktop.checkForUpdate();
      else if (state.status === "downloaded") await window.MitaliDesktop.installUpdate();
    } catch (error) {
      DESKTOP_UPDATE_STATE = { status: "error", error: String(error?.message || error) };
      renderDesktopUpdateIndicator();
    }
  });
}

    }

      // حتى لو فشلت لاحقًا كتابة بيانات الجلسة أو المزامنة المحلية.

      const nextCredentialVersion = Math.max(1, Number(account.credentialVersion || account.securityVersion || currentUser.credentialVersion || currentUser.securityVersion || 1) + 1);

          await window.MitaliFirebase.updateOwnSecurityMetadata({ credentialVersion: nextCredentialVersion, securityVersion: nextCredentialVersion, lastPasswordChangeAt: changedAt });
        } catch (metadataError) {
          metadataSyncFailed = true;
          console.warn("Password changed, but security metadata sync failed:", metadataError);
        }
      }
      account.password = "";
      account.credentialVersion = nextCredentialVersion;
      account.securityVersion = nextCredentialVersion;
      account.lastPasswordChangeAt = changedAt;
      account.updatedAt = changedAt;
      currentUser.password = "";
      currentUser.credentialVersion = nextCredentialVersion;
      currentUser.securityVersion = nextCredentialVersion;
      clearTrustedDevice();
      currentUser.sessionIssuedAt = Date.now();
      currentUser.sessionExpiresAt = Date.now() + SESSION_TTL_MS;
      setSession(currentUser);
      // تحديث كلمة المرور ونسخة الأمان تم تأكيده عبر Firebase/API؛ لا نعيد
      // كتابة قائمة users كاملة من المتصفح بعد تغيير كلمة مرور الحساب الحالي.

        ? "تم تغيير كلمة المرور بنجاح، وسيُعاد تحديث بيانات الجلسة تلقائيًا"
        : "تم تغيير كلمة المرور بنجاح. استخدم كلمة المرور الجديدة في تسجيل الدخول القادم", 4200);
      closeModal();
    } catch (error) {
      console.error("Password change failed:", error);
      // لا نعرض فشلًا إذا كانت Firebase قد قبلت التغيير بالفعل؛ الخطأ هنا
      // يكون في خطوة لاحقة مثل metadata أو persist وليس في كلمة المرور نفسها.
      if (firebasePasswordChanged) {
        showToast("تم تغيير كلمة المرور بنجاح. استخدم كلمة المرور الجديدة في تسجيل الدخول القادم", 4200);
        closeModal();
      } else {
        const code = error && (error.code || error.message);
        errBox.textContent = code === "auth/wrong-password" || code === "auth/invalid-credential"
          ? "كلمة المرور الحالية غير صحيحة."
          : code === "auth/requires-recent-login"
            ? "لأسباب أمنية، سجّل الخروج ثم ادخل مرة أخرى قبل تغيير كلمة المرور."
            : code === "offline"
              ? "لا يوجد اتصال بالإنترنت؛ لا يمكن تغيير كلمة مرور Firebase أثناء عدم الاتصال."
              : "تعذّر تغيير كلمة المرور في Firebase. حاول مرة أخرى.";
        errBox.style.display = "block";
        if (submit) { submit.disabled = false; submit.textContent = "حفظ كلمة المرور"; }
      }
    }
  });
}
// رسالة تأكيد حفظ تعكس الحالة الحقيقية: لو أوفلاين (أو المزامنة موقوفة مؤقتًا أو

function saveToast(entityMsg) {
  const savedOnlyLocally = !(STORAGE_MODE === "firestore" && navigator.onLine);
  if (savedOnlyLocally) {
    showToast(`💾 ${entityMsg} — محفوظ محليًا وسيُرفع تلقائيًا عند عودة الاتصال`, 3800);
  } else {
    showToast(`✅ ${entityMsg}`);
  }
}

// يحوّل أى صيغة إدخال شائعة لرقم هاتف مصرى (محلى أو دولى، بمسافات أو شرطات أو
// رمز + ...) إلى الصيغة الدولية النظيفة التى يتطلّبها رابط wa.me (بادئة الدولة
// 20 بدون أى رمز + أو أصفار زائدة). يُعيد null صراحة لو تعذّر التعرّف على رقم
// هاتف صالح، حتى تتعامل الواجهة مع الحالة بوضوح (تعطيل الزر / تنبيه) بدل توليد
// رابط واتساب مكسور بصمت.
function sanitizePhoneForWhatsApp(raw) {
  if (!raw) return null;
  let digits = String(raw).replace(/\D/g, ""); // إزالة كل ما ليس رقمًا: مسافات، شرطات، +، أقواس...
  if (!digits) return null;
  if (digits.startsWith("0020")) digits = digits.slice(2);           // "0020xxxxxxxxxx" -> "20xxxxxxxxxx"
  else if (digits.startsWith("20") && digits.length >= 12) { /* دولية بالفعل */ }
  else if (digits.startsWith("0")) digits = "20" + digits.slice(1);   // "01012345678" -> "201012345678"
  else if (!digits.startsWith("20")) digits = "20" + digits;          // رقم بلا صفر بداية أصلًا
  // رقم محمول مصرى صالح بعد التطبيع: 20 + 10 أرقام (01xxxxxxxxx بدون الصفر) = 12 رقمًا
  if (!/^20\d{9,10}$/.test(digits)) return null;
  return digits;
}
// يصوغ رسالة واتساب احترافية موحّدة لأى إيصال/زيارة، بحقول اختيارية (تُحذف
// سطورها تلقائيًا لو لم تتوفر بيانتها بدل ترك سطر فارغ فى الرسالة).
// إصلاح: العنوان كان يعرض اسم القسم (clinicName) فقط ويسقط اسم المجمع تمامًا فى
// كل رسالة فعلية، لأن كل نقاط الاستدعاء بالفعل بتمرّر clinicName ("قسم العيادات"
// / "قسم الأسنان") فيبقى النص المبدئى ("مجمع ميت عزون الطبي...") لا يظهر إلا لو
// clinicName فاضية، وهو ما لا يحدث عمليًا. الآن يظهر اسم المجمع دايمًا مع اسم
// القسم المُرسِل منه معًا فى نفس السطر.
function buildWhatsAppMessage({ patientName, clinicName, doctorName, paid, remaining }) {
  const lines = [
    `🏥 مستشفى لجنة زكاة ميت على التخصصي${clinicName ? " - " + clinicName : ""}`,
    patientName ? `عزيزي/عزيزتي ${patientName}،` : null,
    "نشكر لكم زيارتكم، وهذه تفاصيل الحساب:",
    doctorName ? `👨‍⚕️ الطبيب: ${doctorName}` : null,
    paid !== undefined ? `💰 المبلغ المدفوع: ${fmt(paid)} ج.م` : null,
    (remaining !== undefined && remaining !== null)
      ? (remaining > 0 ? `⏳ المبلغ المتبقي: ${fmt(remaining)} ج.م` : `✅ تم سداد كامل المبلغ`)
      : null,
    "",
    "شكرًا لثقتكم بنا 🌿",
  ].filter(v => v !== null);
  return lines.join("\n");
}
// يبنى رابط wa.me جاهزًا؛ يُعيد null لو كان الرقم غير صالح كى يستطيع المستدعى
// إظهار تنبيه مناسب بدل فتح رابط لا يعمل. encodeURIComponent يمنع أى خطأ ناتج
// عن المسافات أو الرموز أو النصوص العربية داخل نص الرسالة.
function buildWhatsAppLink(phone, message) {
  const clean = sanitizePhoneForWhatsApp(phone);
  if (!clean) return null;
  return `https://wa.me/${clean}?text=${encodeURIComponent(message || "")}`;
}
// نقطة الدخول الموحّدة لأى زر/أيقونة واتساب فى الواجهة: تبنى الرسالة (إن
// توفّرت بيانتها) وتفتح المحادثة فى تبويب جديد، أو تُظهر تنبيهًا لطيفًا بدل
// تعطّل صامت لو كان رقم الهاتف مفقودًا أو غير صحيح.
function openWhatsAppChat(phone, messageData) {
  const message = messageData ? buildWhatsAppMessage(messageData) : "";
  const link = buildWhatsAppLink(phone, message);
  if (!link) { showToast("⚠️ رقم الهاتف مفقود أو غير صحيح — تعذّر فتح واتساب"); return; }
  window.open(link, "_blank", "noopener");
}
// رسالة تذكير بموعد متابعة قادم - منفصلة تمامًا عن رسالة الإيصال المالى (بلا أى
// تفاصيل مبالغ)، مخصَّصة فقط لتذكير المريض بميعاده القادم قبل الحضور.

  ].filter(v => v !== null);

}
function openWhatsAppReminder(phone, data) {

// وملحوظًا خصوصًا على الموبايلات المتوسطة. الحل: تقسيم صفحات بسيط - نعرض 50 صف
// فقط فى كل مرة بدل الجدول كامل، مع أزرار تنقّل واضحة وعداد "يعرض X-Y من Z".
const PAGE_SIZE = 50;
function paginateList(list, pageKey) {
  const totalPages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
  let current = state.tablePage[pageKey] || 1;
  if (current > totalPages) current = totalPages;
  if (current < 1) current = 1;
  state.tablePage[pageKey] = current;
  const start = (current - 1) * PAGE_SIZE;
  return { pageItems: list.slice(start, start + PAGE_SIZE), current, totalPages, total: list.length, start: list.length ? start + 1 : 0, end: Math.min(start + PAGE_SIZE, list.length) };
}
function paginationControlsHTML(pageKey, pageInfo) {
  if (pageInfo.total <= PAGE_SIZE) return "";
  return `
    <div class="pagination-bar" style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; padding:12px 4px 4px;">

// تصدير جدول إلى CSV يفتح مباشرة فى Excel (بدون أي مكتبات خارجية)
function exportTableToCSV(filename, headers, rows) {
  const escCsv = v => {
    const s = (v === null || v === undefined) ? "" : String(v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const lines = [headers.map(escCsv).join(","), ...rows.map(r => r.map(escCsv).join(","))];
  const csv = "\uFEFF" + lines.join("\r\n"); // BOM لدعم عرض العربية بشكل صحيح فى Excel
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

    <div class="card">

          ${visitsPg.pageItems.map(v => {

  bindPaginationEvents(c);
  bindPeriodFilterEvents(`visit_${kind}`, granKey, valKey);

  // اقتراحات تلقائية لاسم المريض: بتمنع مشكلة إن المريض يرجع تاني والموظف ينسى
