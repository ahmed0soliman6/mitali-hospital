        if (password.length < 6) { showToast("⚠️ كلمة المرور يجب أن تكون 6 أحرف أو أرقام على الأقل"); return; }
        const saveButton = e.target.querySelector('button[type="submit"]');
        if (saveButton) { saveButton.disabled = true; saveButton.textContent = "جارٍ إنشاء الحساب..."; }
        const response = await window.MitaliFirebase.adminCreateAccount({
          displayName: String(fd.get("displayName") || "").trim(),
          username,
          password,
          role,
          status: "نشط",
          permissions: emptyPermissions(),
        });
        const newUser = response && response.account;
        if (!newUser) throw new Error('invalid-admin-api-response');
        DB.staffAccounts = [...(DB.staffAccounts || []).filter(a => a.id !== newUser.id && a.username !== newUser.username), newUser];
        await cacheLocally("staffAccounts", DB.staffAccounts);
        await writeSyncBaseline("staffAccounts", DB.staffAccounts);
        logActivity("إضافة مستخدم", "users", null, { displayName: newUser.displayName, username: newUser.username, role: newUser.role });
        operationMessage = "تم إنشاء الحساب وحفظه في Firebase؛ كلمة المرور صالحة الآن على الأجهزة الجديدة";
      }
      state.editUserId = null;
      showToast(operationMessage);
      route();
    } catch (err) {
      console.error("Professional account save failed:", err);
      const reason = adminAccountFailureMessage(err, "تعذر حفظ الحساب على الخادم؛ لم تُعرض رسالة نجاح ولم يُعتمد التعديل");
      showToast(`⚠️ ${reason}`, 7000);
    }
  });
  const cancelBtn = document.getElementById("cancelUserEdit");
  if (cancelBtn) cancelBtn.addEventListener("click", () => { state.editUserId = null; route(); });

  c.querySelectorAll("[data-edituser]").forEach(b => b.addEventListener("click", () => { state.editUserId = b.dataset.edituser; route(); }));
  const passwordToggle = form?.querySelector("[data-toggle-user-password]");
  const passwordField = form?.querySelector('input[name="password"]');
  if (passwordToggle && passwordField) passwordToggle.addEventListener("click", () => {
    const shown = passwordField.type === "text";
    passwordField.type = shown ? "password" : "text";
    passwordToggle.textContent = shown ? "إظهار" : "إخفاء";
  });

  c.querySelectorAll("[data-resetpass]").forEach(b => b.addEventListener("click", () => {
    if (!canEdit) { showToast("⚠️ ليس لديك صلاحية"); return; }
    const a = DB.staffAccounts.find(x => x.id === b.dataset.resetpass);
    if (!a || !a.firebaseUid) { showToast("⚠️ الحساب القديم غير مرتبط بالمصادقة الآمنة؛ أنشئ حسابًا مرحّلًا أولًا", 7000); return; }
    const old = document.getElementById("adminResetPasswordModal"); if (old) old.remove();
    const modal = document.createElement("div");
    modal.id = "adminResetPasswordModal";
    modal.className = "modal-backdrop";
    modal.innerHTML = `<div class="modal-card" role="dialog" aria-modal="true" style="max-width:430px;">
      <div class="section-title">تعيين كلمة مرور جديدة</div>
      <p class="hint" style="line-height:1.8;">للمستخدم: <strong>${esc(a.displayName)}</strong>. اكتب كلمة جديدة؛ لن تظهر الكلمة بعد الحفظ، وستُلغى الاعتمادات القديمة فور نجاح العملية.</p>
      <form id="adminResetPasswordForm">
        <div class="field"><label>كلمة المرور الجديدة</label><div style="position:relative;"><input id="adminResetPasswordInput" type="password" minlength="6" required autocomplete="new-password" style="padding-left:62px;"><button type="button" class="btn sm ghost" id="adminResetPasswordToggle" style="position:absolute; left:5px; top:50%; transform:translateY(-50%); padding:4px 7px;">إظهار</button></div></div>
        <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:14px;"><button type="button" class="btn ghost" id="closeAdminResetPassword">إلغاء</button><button type="submit" class="btn">حفظ كلمة المرور</button></div>
      </form>
    </div>`;
    document.body.appendChild(modal);
    const close = () => modal.remove();
    modal.querySelector("#closeAdminResetPassword").addEventListener("click", close);
    modal.addEventListener("click", e => { if (e.target === modal) close(); });
    modal.querySelector("#adminResetPasswordToggle").addEventListener("click", () => {
      const input = modal.querySelector("#adminResetPasswordInput"); const shown = input.type === "text"; input.type = shown ? "password" : "text"; modal.querySelector("#adminResetPasswordToggle").textContent = shown ? "إظهار" : "إخفاء";
    });
    modal.querySelector("#adminResetPasswordForm").addEventListener("submit", async e => {
      e.preventDefault();
      const btn = e.target.querySelector('button[type="submit"]'); const password = modal.querySelector("#adminResetPasswordInput").value;
      if (password.length < 6) { showToast("⚠️ كلمة المرور يجب أن تكون 6 أحرف أو أرقام على الأقل"); return; }
      btn.disabled = true; btn.textContent = "جارٍ الحفظ على الخادم...";
      try {
        const response = await window.MitaliFirebase.adminUpdateAccount({ uid: a.firebaseUid, displayName: a.displayName, username: a.username, role: a.role, status: a.status || "نشط", permissions: a.permissions || emptyPermissions(), password });
        const updated = response && response.account; if (!updated) throw new Error("invalid-admin-api-response");
        const index = DB.staffAccounts.findIndex(x => x.id === a.id); if (index >= 0) DB.staffAccounts[index] = Object.assign({}, DB.staffAccounts[index], updated);
        await cacheLocally("staffAccounts", DB.staffAccounts); await writeSyncBaseline("staffAccounts", DB.staffAccounts);
        logActivity("تغيير كلمة مرور مستخدم وإلغاء اعتماد الأجهزة", "users", { username: a.username }, { username: a.username, credentialVersion: updated.credentialVersion });
        showToast("تم حفظ كلمة المرور وإلغاء الاعتمادات القديمة"); close(); route();
      } catch (err) {
        console.error(err);
        btn.disabled = false;
        btn.textContent = "حفظ كلمة المرور";
        showToast(`⚠️ ${adminAccountFailureMessage(err, "لم تُحفظ كلمة المرور؛ لم يتغير اعتماد المستخدم")}`, 7000);
      }
    });
  }));

  c.querySelectorAll("[data-toggleuser]").forEach(b => b.addEventListener("click", async () => {
    if (!canEdit) { showToast("⚠️ ليس لديك صلاحية"); return; }
    const a = DB.staffAccounts.find(x => x.id === b.dataset.toggleuser); if (!a) return;
    if (currentUser && currentUser.id === a.id) { showToast("⚠️ لا يمكنك إيقاف حسابك الحالي"); return; }
    if (!a.firebaseUid) { showToast("⚠️ الحساب القديم غير مرتبط بالمصادقة الآمنة؛ لا يمكن إيقافه من المسار الجديد", 7000); return; }
    const nextStatus = a.status === "موقوف" ? "نشط" : "موقوف";
    if (nextStatus === "موقوف" && a.role === "مدير" && countActiveAdmins(a.id) === 0) { showToast("⚠️ لا يمكن إيقاف آخر مدير نشط فى النظام"); return; }
    b.disabled = true; b.textContent = "جارٍ الحفظ...";
    try {
      const response = await window.MitaliFirebase.adminUpdateAccount({ uid: a.firebaseUid, displayName: a.displayName, username: a.username, role: a.role, status: nextStatus, permissions: a.permissions || emptyPermissions() });
      const updated = response && response.account; if (!updated) throw new Error("invalid-admin-api-response");
      const index = DB.staffAccounts.findIndex(x => x.id === a.id); if (index >= 0) DB.staffAccounts[index] = Object.assign({}, DB.staffAccounts[index], updated);
      await cacheLocally("staffAccounts", DB.staffAccounts); await writeSyncBaseline("staffAccounts", DB.staffAccounts);
      logActivity(nextStatus === "موقوف" ? "إيقاف مستخدم وإلغاء اعتماد الأجهزة" : "تفعيل مستخدم", "users", a.status, nextStatus);
      showToast(nextStatus === "موقوف" ? "تم إيقاف المستخدم وإلغاء اعتمادات أجهزته" : "تم تفعيل المستخدم"); route();
    } catch (err) {
      console.error(err);
      b.disabled = false;
      showToast(`⚠️ ${adminAccountFailureMessage(err, "لم يُحفظ تغيير حالة المستخدم على الخادم")}`, 7000);
    }
  }));

  c.querySelectorAll("[data-deluser]").forEach(b => b.addEventListener("click", async () => {
    if (!canDelete) { showToast("⚠️ ليس لديك صلاحية حذف المستخدمين"); return; }
    const a = DB.staffAccounts.find(x => x.id === b.dataset.deluser); if (!a) return;
    if (currentUser && (currentUser.id === a.id || currentUser.firebaseUid === a.firebaseUid)) { showToast("⚠️ لا يمكنك حذف حسابك الحالي أثناء تسجيل الدخول به"); return; }
    if (!a.firebaseUid) { showToast("⚠️ الحساب القديم غير مرتبط بالمصادقة الآمنة؛ لم يُحذف", 7000); return; }
    if (!confirm(`سيُحذف حساب الدخول وملف الصلاحيات للمستخدم "${a.displayName}" من النظام. لن تتأثر بيانات المرضى أو الزيارات. هل تتابع؟`)) return;
    b.disabled = true; b.textContent = "جارٍ الحذف...";
    try {
      const response = await window.MitaliFirebase.adminAccountRequest({ action: "delete", uid: a.firebaseUid });
      DB.staffAccounts = DB.staffAccounts.filter(x => x.id !== a.id); await cacheLocally("staffAccounts", DB.staffAccounts); await writeSyncBaseline("staffAccounts", DB.staffAccounts);
      try { await refreshAccountsFromAdminApi(false); } catch (refreshError) { console.warn("Fresh account list unavailable after delete:", refreshError); }
      logActivity("حذف حساب مستخدم", "users", { username: a.username }, null);
      showToast(response?.deleted?.alreadyRemoved ? "الحساب محذوف بالفعل؛ تم تحديث القائمة" : "تم حذف حساب الدخول وملف الصلاحيات"); route();
    } catch (err) {
      console.error(err);
      if (err && (err.code === "account-not-found" || err.code === "account-already-removed")) {
        DB.staffAccounts = DB.staffAccounts.filter(x => x.id !== a.id);
        await cacheLocally("staffAccounts", DB.staffAccounts);
        await writeSyncBaseline("staffAccounts", DB.staffAccounts);
        showToast("الحساب غير موجود على الخادم؛ تم تنظيف القائمة المحلية");
        route();
      } else {
        b.disabled = false;
        showToast(`⚠️ ${adminAccountFailureMessage(err, "لم يكتمل حذف الحساب على الخادم")}`, 7000);
      }
    }
  }));

  renderPermissionsPanel(document.getElementById("usersPermissionsPanel"), DB.staffAccounts || []);
}

// ======================================================================
// لوحة الصلاحيات المدمجة داخل صفحة المستخدمين
// ======================================================================
function renderPermissionsPanel(container, accounts) {
  if (!container) return;
  const list = Array.isArray(accounts) ? accounts : [];
  if (!state.permUserId || !list.some(a => a.id === state.permUserId)) state.permUserId = list[0]?.id || "";
  const target = list.find(a => a.id === state.permUserId) || list[0];
  const isAdminTarget = !!target && target.role === "مدير";
  const refreshing = ADMIN_ACCOUNTS_REFRESH_IN_PROGRESS && navigator.onLine;
  container.innerHTML = `
    <div class="card" style="margin-top:18px;">
      <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;">
        <div>
          <div class="section-title" style="margin-bottom:3px;">🔐 الصلاحيات التفصيلية</div>
          <div class="hint">اختر مستخدمًا لمراجعة الصفحات والوظائف المتاحة له. المدير يملك جميع الصلاحيات تلقائيًا.</div>
        </div>
        <button type="button" class="btn sm ghost" id="refreshUnifiedAccounts">↻ تحديث قائمة المستخدمين</button>
      </div>
      ${refreshing ? `<div class="sync-inline-note" style="margin-top:10px;">⟳ جارٍ التحقق من أحدث الحسابات من Firebase...</div>` : ""}
      <div class="two-col" style="margin-top:14px; align-items:start;">
        <div>
          <div class="section-title" style="font-size:14px;">الحسابات <span class="hint">${list.length}</span></div>
          <div style="max-height:420px; overflow-y:auto; display:grid; gap:7px;">
            ${list.map(a => `
              <button type="button" class="doctor-chip" data-unified-permuser="${esc(a.id)}" style="cursor:pointer; text-align:right; width:100%; border-color:${target && target.id === a.id ? "var(--navy)" : "var(--line)"};">
                <span style="display:block; font-weight:800;">${esc(a.displayName || "بدون اسم")}</span>
                <span class="meta" style="display:block; margin-top:3px;">اسم المستخدم: ${esc(a.username || "غير مسجل")} · ${esc(a.role || "موظف")}${a.status === "موقوف" ? " · موقوف" : ""}</span>
              </button>`).join("") || `<div class="hint" style="padding:14px 0;">لا توجد حسابات في مصدر الحقيقة users.</div>`}
          </div>
        </div>
        <div>
          <div class="section-title" style="font-size:14px;">صلاحيات: ${target ? `${esc(target.displayName || "بدون اسم")} <span class="hint">(${esc(target.username || "غير مسجل")})</span>` : "-"}</div>
          ${target ? `
          <form id="unifiedPermForm">
            ${PERMISSION_MODULES.map(m => `
              <div style="margin-bottom:12px; padding:10px 0; border-bottom:1px solid var(--line);">
                <div style="font-weight:800; font-size:13px; color:var(--navy); margin-bottom:8px;">${m.label}</div>
                <div style="display:flex; flex-wrap:wrap; gap:12px;">
                  ${m.actions.map(a => `<label style="display:flex; align-items:center; gap:6px; font-size:12.5px; cursor:pointer;"><input type="checkbox" name="${m.key}.${a.key}" ${isAdminTarget || (target.permissions && target.permissions[m.key] && target.permissions[m.key][a.key]) ? "checked" : ""} ${isAdminTarget ? "disabled" : ""}>${a.label}</label>`).join("")}
                </div>
              </div>`).join("")}
            ${isAdminTarget ? `<div class="hint">صلاحيات المدير كاملة ولا تحتاج إلى حفظ يدوي.</div>` : `<button type="submit" class="btn">حفظ الصلاحيات</button>`}
          </form>` : `<div class="hint">أنشئ مستخدمًا أو انتظر تحميل الحسابات من Firebase.</div>`}
        </div>
      </div>
    </div>`;
  container.querySelectorAll("[data-unified-permuser]").forEach(row => row.addEventListener("click", () => { state.permUserId = row.dataset.unifiedPermuser; renderUsersPage(); }));
  const refreshButton = container.querySelector("#refreshUnifiedAccounts");
  if (refreshButton) refreshButton.addEventListener("click", async () => {
    refreshButton.disabled = true; refreshButton.textContent = "جارٍ التحديث...";
    await refreshAccountsFromAdminApi(true);
    if (!ADMIN_ACCOUNTS_REFRESH_IN_PROGRESS) renderUsersPage();
  });
  const form = container.querySelector("#unifiedPermForm");
  if (form) form.addEventListener("submit", async e => {
    e.preventDefault();
    if (!can("users", "editPerms")) { showToast("⚠️ ليس لديك صلاحية تعديل الصلاحيات"); return; }
    const selected = list.find(a => a.id === state.permUserId);
    if (!selected || selected.role === "مدير") return;
    const perms = emptyPermissions();
    PERMISSION_MODULES.forEach(m => m.actions.forEach(a => { perms[m.key][a.key] = !!form.querySelector(`[name="${m.key}.${a.key}"]`)?.checked; }));
    if (!selected.firebaseUid || !window.MitaliFirebase?.adminUpdateAccount) { showToast("⚠️ الحساب غير مرتبط بخدمة المصادقة الآمنة"); return; }
    const button = form.querySelector('button[type="submit"]');
    if (button) { button.disabled = true; button.textContent = "جارٍ الحفظ على الخادم..."; }
    try {
      const response = await window.MitaliFirebase.adminUpdateAccount({ uid: selected.firebaseUid, displayName: selected.displayName, username: selected.username, role: selected.role, status: selected.status || "نشط", permissions: perms }, "permissions");
      const updated = response && response.account; if (!updated) throw new Error("invalid-admin-api-response");
      const index = DB.staffAccounts.findIndex(x => x.id === selected.id); if (index >= 0) DB.staffAccounts[index] = Object.assign({}, DB.staffAccounts[index], updated);
      await cacheLocally("staffAccounts", DB.staffAccounts); await writeSyncBaseline("staffAccounts", DB.staffAccounts);
      await refreshAccountsFromAdminApi(false);
      logActivity("تعديل صلاحيات مستخدم وإلغاء اعتماد الأجهزة", "permissions", null, selected.displayName);
      showToast("تم حفظ الصلاحيات على Firestore وإلغاء الاعتمادات القديمة");
      renderUsersPage();
    } catch (err) {
      console.error("Unified permissions save failed:", err);
      if (button) { button.disabled = false; button.textContent = "حفظ الصلاحيات"; }
      showToast(`⚠️ ${adminAccountFailureMessage(err, "لم تُحفظ الصلاحيات؛ لم يتغير وصول المستخدم")}`, 7000);
    }
  });
}

// ======================================================================
// صفحة سجل النشاط (Audit Log)
// ======================================================================
function renderAuditLogPage() {
  const c = document.getElementById("content");
  const all = [...(DB.auditLog || [])].reverse(); // الأحدث أولًا
  const userFilter = state.auditFilters?.user || "";
  const termFilter = (state.auditFilters?.term || "").trim().toLowerCase();
  const dateFilter = state.auditFilters?.date || "";
  const filtered = all.filter(r =>
    (!userFilter || r.userId === userFilter) &&
    (!dateFilter || r.date === dateFilter) &&
    (!termFilter || (r.action || "").toLowerCase().includes(termFilter) || (r.page || "").toLowerCase().includes(termFilter))
  );
  const shown = paginateList(filtered, "auditLog");
  const users = DB.staffAccounts || [];

  c.innerHTML = `
    <div class="card" style="margin-bottom:14px; display:flex; gap:10px; flex-wrap:wrap; align-items:end;">
      <div class="field" style="min-width:180px;">
        <label>المستخدم</label>
        <select id="auditUserFilter">
          <option value="">الكل</option>
          ${users.map(u => `<option value="${u.id}" ${userFilter === u.id ? "selected" : ""}>${esc(u.displayName)}</option>`).join("")}
        </select>
      </div>
      <div class="field" style="min-width:150px;">
        <label>التاريخ</label>
        <input type="date" id="auditDateFilter" value="${esc(dateFilter)}">
      </div>
      <div class="field" style="flex:1; min-width:200px;">
        <label>بحث فى العملية / الصفحة</label>
        <input type="text" id="auditTermFilter" value="${esc(termFilter)}" placeholder="مثال: حذف، الأطباء...">
      </div>
      <div class="field"><button class="btn ghost" id="auditClearFilters">مسح الفلاتر</button></div>
      <div class="field"><button class="btn danger" id="auditClearLog">حذف كل السجل</button></div>
    </div>

    <div class="card">
      <div class="section-title">سجل النشاط <span class="hint">${fmtInt(filtered.length)} عملية</span></div>
      <div class="table-wrap"><table>
        <thead><tr>
          <th>التاريخ</th><th>الوقت</th><th>المستخدم</th><th>الصفحة</th><th>العملية</th><th>القيمة القديمة</th><th>القيمة الجديدة</th><th>الجهاز</th>
        </tr></thead>
        <tbody>
          ${shown.pageItems.length === 0 ? `<tr class="empty-row"><td colspan="8">لا توجد سجلات مطابقة</td></tr>` : ""}
          ${shown.pageItems.map(r => `
            <tr>
              <td>${esc(r.date)}</td>
              <td>${esc(r.time)}</td>
              <td>${esc(r.userName)}</td>
              <td>${esc(PAGE_TITLES[r.page] || r.page)}</td>
              <td>${esc(r.action)}</td>
              <td style="max-width:180px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;" title="${esc(r.oldValue)}">${esc(r.oldValue) || "-"}</td>
              <td style="max-width:180px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;" title="${esc(r.newValue)}">${esc(r.newValue) || "-"}</td>
              <td style="max-width:140px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;" title="${esc(r.device)}">${esc(r.device)}</td>
            </tr>`).join("")}
        </tbody>
      </table></div>
      ${paginationControlsHTML("auditLog", shown)}
    </div>
  `;

  bindPaginationEvents(c);
  state.auditFilters = state.auditFilters || {};
  const uf = document.getElementById("auditUserFilter");
  uf.addEventListener("change", () => { state.auditFilters.user = uf.value; state.tablePage.auditLog = 1; route(); });
  const df = document.getElementById("auditDateFilter");
  df.addEventListener("change", () => { state.auditFilters.date = df.value; state.tablePage.auditLog = 1; route(); });
  const tf = document.getElementById("auditTermFilter");
  tf.addEventListener("input", () => {
    // نحافظ على التركيز وموضع المؤشر بعد إعادة الرسم حتى لا تتوقف الكتابة عند أول حرف
    const caret = tf.selectionStart;
    state.auditFilters.term = tf.value;
    route();
    const newTf = document.getElementById("auditTermFilter");
    if (newTf) { newTf.focus(); newTf.setSelectionRange(caret, caret); }
  });
  document.getElementById("auditClearFilters").addEventListener("click", () => { state.auditFilters = {}; route(); });
  document.getElementById("auditClearLog").addEventListener("click", () => {
    if (!isAdminUser()) { showToast("⚠️ حذف السجل متاح للمدير فقط"); return; }
    if (!confirm("سيتم حذف كل سجل النشاط نهائيًا. متأكد؟")) return;
    DB.auditLog = [];
    persist("auditLog");
    showToast("تم حذف سجل النشاط");
    route();
  });
}

// ======================================================================
// تسجيل الدخول
// ======================================================================
const SESSION_KEY = APP_PREFIX + "session_user";
const LOGIN_GUARD_KEY = APP_PREFIX + "login_guard_v1";
const SESSION_TTL_MS = 8 * 60 * 60 * 1000;
const OFFLINE_TRUST_TTL_MS = 7 * 24 * 60 * 60 * 1000;
const MAX_LOGIN_FAILURES = 5;
const LOGIN_LOCK_MS = 5 * 60 * 1000;
const ADMIN_RECOVERY_KEY = APP_PREFIX + "admin_recovery_v1";
const DEFAULT_RECOVERY_QUESTION = "ما الاسم السري الذي يحدده مدير النظام؟";
function generateRecoveryCode() {
  const alphabet = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789";
  const bytes = new Uint8Array(16);
  if (window.crypto?.getRandomValues) window.crypto.getRandomValues(bytes);
  else for (let i = 0; i < bytes.length; i++) bytes[i] = Math.floor(Math.random() * 256);
  return Array.from(bytes, b => alphabet[b % alphabet.length]).join("");
}
async function digestRecoveryAnswer(value) {
  const text = String(value || "").trim().normalize("NFKC");
  if (window.crypto && crypto.subtle) {
    const bytes = new TextEncoder().encode(text);
    const digest = await crypto.subtle.digest("SHA-256", bytes);
    return Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2, "0")).join("");
  }
  // متصفح قديم: لا نسجل الإجابة نفسها؛ هذا بديل توافق محدود.
  let hash = 2166136261;
  for (let i = 0; i < text.length; i++) hash = Math.imul(hash ^ text.charCodeAt(i), 16777619);
  return String(hash >>> 0);
}

}

  if (!account || account.status === "موقوف") return false;
  const localVersion = Number(currentUser.credentialVersion || currentUser.securityVersion || account.credentialVersion || account.securityVersion || 1);
  if (Number(account.credentialVersion || account.securityVersion || 1) !== localVersion) return false;

    const authUser = window.MitaliFirebase.authUser();
    const offlineTrusted = !navigator.onLine && Number(currentUser.offlineTrustedUntil || 0) > Date.now();

      try {
        const profile = await window.MitaliFirebase.getUserProfile(authUser.uid, { source: navigator.onLine ? "server" : undefined });

        // المحلي فورًا، ثم realtime/التحديث الخلفي يجلبان أحدث السجلات بعد عرض الواجهة.
        // لا نعيد تحميل staffAccounts من الكاش هنا؛ فقد وصلنا قبل قليل إلى
        // النسخة المؤكدة من الخادم، وإعادة تحميلها محليًا كانت تستبدل الصلاحيات
        // الحديثة ببيانات قديمة وتُظهر الحساب كأنه بلا صلاحيات. نحمّل بقية
        // بيانات التشغيل فقط، وتبقى قائمة الحسابات من النسخة server-confirmed.
        const postLoginKeys = CORE_BOOT_KEYS.filter(key => key !== "staffAccounts");
        loadKeys(postLoginKeys, { preferCache: true }).then(() => {
          if (currentUser && state.page !== "login") route();
        }).catch(reloadError => console.warn("Firestore post-login data reload failed:", reloadError));
        account = (DB.staffAccounts || []).find(a => a.firebaseUid === firebaseAuthAccount.firebaseUid) || account;
      } catch (reloadError) {
        console.warn("Firestore account reload after login failed:", reloadError);
      }
    }
    clearLoginFailures();
    account.lastLogin = new Date().toISOString();
    try {
      if (firebaseAuthAccount && window.MitaliFirebase.updateOwnSecurityMetadata) {
        window.MitaliFirebase.updateOwnSecurityMetadata({ lastLogin: account.lastLogin }).catch(persistError => console.warn("Could not persist login metadata:", persistError && persistError.code ? persistError.code : "remote-write-error"));
      }
    } catch (persistError) {
      console.warn("Could not persist login metadata:", persistError && persistError.code ? persistError.code : "remote-write-error");
    }
    setSession({ id: account.id, username: account.username, displayName: account.displayName, role: account.role, firebaseUid: account.firebaseUid || null, securityVersion: Number(account.securityVersion || 1), credentialVersion: Number(account.credentialVersion || account.securityVersion || 1) });
    if (navigator.onLine) flushSyncQueue();
    if (navigator.onLine && account.firebaseUid) rememberTrustedDevice(account, password).catch(error => console.warn("Trusted device enrollment failed:", error));
    logActivity("تسجيل دخول", "login");
    state.page = firstAccessiblePage(); state.editId = null;
    resetIdleTimer();
    route();
  });
}

async function logout() {
  document.body.classList.remove("sidebar-open");
  logActivity("تسجيل خروج", "login");
  cleanupRealtimeChannels("logout");
  if (window.MitaliFirebase && window.MitaliFirebase.authUser()) {
    try { await window.MitaliFirebase.signOut(); } catch (e) { console.warn("Firebase sign-out failed:", e); }
  }
  stopIdleTimer();
  clearSession();
  // لا نعيد تحميل كل جداول المستشفى عند تسجيل الخروج؛ تبقى النسخة المحلية
  // متاحة لشاشة الدخول والعمل دون إنترنت، ويقرأ الدخول الجديد profile/account
  // من المصدر الرئيسي عند الحاجة فقط.
  PAGE_DATA_LOADING.clear();
  Object.keys(PAGE_DATA_LOADED_AT).forEach(key => delete PAGE_DATA_LOADED_AT[key]);
  renderLogin();
}
// ======================================================================
// الإغلاق التلقائى بعد عدم الاستخدام (Idle Auto-Logout)
// حماية إضافية لبيانات المرضى والخزينة: لو تُرك الجهاز بدون أى حركة (ماوس/لوحة
// مفاتيح/لمس) للمدة المحددة فى الإعدادات (5 دقائق افتراضيًا)، يسجَّل الخروج تلقائيًا.
// المدة قابلة للتحكم من صفحة الإعدادات (متاحة فقط لمن يملك صلاحية "تعديل الإعدادات").
// ======================================================================
let idleTimer = null;
function idleTimeoutMs() {
  const mins = Number(DB.settings && DB.settings.idleTimeoutMinutes);
  return (mins > 0 ? mins : 5) * 60 * 1000;
}
function isIdleTimeoutEnabled() {
  return !DB.settings || DB.settings.idleTimeoutMinutes !== 0; // 0 يعنى مُعطَّل صراحةً
}
function resetIdleTimer() {
  if (idleTimer) { clearTimeout(idleTimer); idleTimer = null; }
  if (!currentUser || !isIdleTimeoutEnabled()) return;
  idleTimer = setTimeout(() => {
    if (!currentUser) return;
    logActivity("تسجيل خروج تلقائى (عدم استخدام)", "login");
    clearSession();
    renderLogin("تم تسجيل خروجك تلقائيًا بعد فترة من عدم الاستخدام حفاظًا على أمان البيانات. سجّل الدخول مرة أخرى للمتابعة.");
  }, idleTimeoutMs());
}
function stopIdleTimer() {
  if (idleTimer) { clearTimeout(idleTimer); idleTimer = null; }
}
["mousemove", "mousedown", "keydown", "touchstart", "scroll", "click", "wheel"].forEach(evt => {
  document.addEventListener(evt, () => { if (currentUser) resetIdleTimer(); }, { passive: true });
});
document.addEventListener("visibilitychange", () => { if (!document.hidden && currentUser) resetIdleTimer(); });

// ======================================================================
// التشغيل
// ======================================================================
const realtimeRefreshInProgress = new Set();
const firestoreRealtimeUnsubs = new Map();
let realtimePageKey = "";
// تحديث شبه لحظي للجدول المفتوح فقط. لا نراقب users أو كل جداول المستشفى،
// ونترك بقية البيانات لقراءة الصفحة عند فتحها لتقليل الاستهلاك.
const PAGE_REALTIME_KEYS = {
  clinic: ["visitsClinic"], dental: ["visitsDental"],
  operations: ["visitsOperations"], labs: ["visitsLabs"], radiology: ["visitsRadiology"],
  income: ["income"], expense: ["expense"], payroll: ["payroll"],
  patientFilesClinic: ["visitsClinic"], patientFilesDental: ["visitsDental"],
  outstandingBalancesClinic: ["visitsClinic"], outstandingBalancesDental: ["visitsDental"],
  outstandingBalancesOperations: ["visitsOperations"], outstandingBalancesLabs: ["visitsLabs"],
  outstandingBalancesRadiology: ["visitsRadiology"]
};
function cleanupRealtimeChannels(reason) {
  firestoreRealtimeUnsubs.forEach((unsubscribe) => {
    try { unsubscribe(); } catch (e) { console.warn("Firestore listener cleanup failed:", reason, e); }
  });
  firestoreRealtimeUnsubs.clear();
  realtimePageKey = "";
}

async function refreshTableFromFirestore(key, changes) {
  if (STORAGE_MODE !== "firestore" || !window.MitaliFirebase || realtimeRefreshInProgress.has("fs:" + key)) return;
  // لا تسمح لقطة/حدث خارجي باستبدال تعديل محلي لم يؤكده الخادم.
  if (PENDING_WRITES > 0 && SYNC_QUEUE_KEYS.has(String(key))) return;
  realtimeRefreshInProgress.add("fs:" + key);
  try {
    let safeFresh;
    if (["settings", "categories", "specialties"].includes(key)) {
      safeFresh = await window.MitaliFirebase.getValue(key, DB[key]);
    } else {
      const next = Array.isArray(DB[key]) ? DB[key].slice() : [];
      const tombstones = await readSyncTombstones();
      const blocked = new Set((Array.isArray(tombstones[key]) ? tombstones[key] : []).map(String));
      for (const change of (Array.isArray(changes) ? changes : [])) {
        const record = change && change.record;
        if (!record || record.id == null) continue;
        if (blocked.has(String(record.id)) && change.type !== "removed") continue;
        const index = next.findIndex(item => item && String(item.id) === String(record.id));
        if (change.type === "removed") {
          if (index >= 0) next.splice(index, 1);
        } else if (index >= 0) {
          next[index] = record;
        } else {
          next.push(record);
        }
      }
      safeFresh = next;
    }
    if (safeFresh === undefined || safeFresh === null) return;
    if (JSON.stringify(safeFresh) === JSON.stringify(DB[key])) return;
    DB[key] = safeFresh;
    await cacheLocally(key, safeFresh);
    if (Array.isArray(safeFresh)) await writeSyncBaseline(key, safeFresh);
    DATA_VERSION++;
    if (key === "staffAccounts" && currentUser) {
      const me = getCurrentAccount();
      if (!me || me.status === "موقوف" || Number(me.credentialVersion || me.securityVersion || 1) !== Number(currentUser.credentialVersion || currentUser.securityVersion || 1)) {
        clearSession();
        renderLogin("انتهت صلاحية الجلسة الأمنية. سجّل الدخول مرة أخرى.");
        return;
      }
    }
    if (currentUser && !isMidEdit() && !isUserActivelyTyping()) route();
  } catch (e) {
    console.error("Firestore realtime refresh failed for", key, e);
  } finally {
    realtimeRefreshInProgress.delete("fs:" + key);
  }
}

function subscribeFirestoreRealtime(page = state.page) {
  if (STORAGE_MODE !== "firestore" || !window.MitaliFirebase || !window.MitaliFirebase.authUser()) return;
  const keys = Array.isArray(PAGE_REALTIME_KEYS[page]) ? PAGE_REALTIME_KEYS[page] : [];
  const nextPageKey = `${page}:${keys.join(",")}`;
  if (realtimePageKey === nextPageKey && firestoreRealtimeUnsubs.size) return;
  cleanupRealtimeChannels("page-change");
  realtimePageKey = nextPageKey;
  keys.forEach((key) => {
    try {
      const unsubscribe = window.MitaliFirebase.subscribe(key, (changes) => refreshTableFromFirestore(key, changes), (error) => {
        console.warn("Firestore listener error for", key, error);
        firestoreRealtimeUnsubs.delete(key);
      });
      if (typeof unsubscribe === "function") firestoreRealtimeUnsubs.set(key, unsubscribe);
    } catch (e) {
      console.error("Firestore subscribe failed for", key, e);
    }
  });
}

async function boot() {
  document.getElementById("content").innerHTML = `<div style="text-align:center; padding:80px; color:var(--muted);">جارٍ تحميل النظام...</div>`;
  try {
    // الجلسة المحفوظة تعرض الكاش المحلي فورًا؛ نقرأ staffAccounts فقط عند
    // شاشة الدخول، ثم نقرأ بيانات الصفحة الحالية بعد نجاح الجلسة.
    // لا نقرأ users بالكامل قبل المصادقة. نحمّل كاش الحسابات محليًا فقط
    // لاستخدام اعتماد الجهاز السابق، ثم يقرأ Firebase Auth ملف المستخدم الحالي.
    const bootKeys = getSession() ? CORE_BOOT_KEYS.filter(key => key !== "staffAccounts") : ["staffAccounts"];
    await loadKeys(bootKeys, { preferCache: true });
  } catch (e) {
    console.error("Load error, using defaults:", e);
    DB.doctors = seedDoctors(); DB.employees = seedEmployees(); DB.settings = { openingBalance: 10000 };
    DB.staffAccounts = seedStaffAccounts();
  }
  currentUser = getSession();
  if (!currentUser) { renderLogin(); return; }
  // انتظر استعادة Firebase Auth بعد reload قبل فحص الجلسة؛ currentUser قد يكون
  // محفوظًا محليًا بينما auth.currentUser لم يُستعد بعد من IndexedDB.
  if (navigator.onLine && window.MitaliFirebase && window.MitaliFirebase.waitForAuth) {
    try { await window.MitaliFirebase.waitForAuth(); } catch (authWaitError) { console.warn("Firebase Auth restore wait failed:", authWaitError); }
  }
  // لا نعتمد على قائمة staffAccounts المحلية وحدها عند reload. نقرأ ملف المستخدم
  // الحالي من users مباشرة إذا لم يكن موجودًا في الكاش، ثم نضعه في الكاش دون
  // إعادة تحميل قائمة الحسابات كاملة.
  let sessionAccount = (DB.staffAccounts || []).find(a => a.id === currentUser.id || (currentUser.username && a.username === currentUser.username));
  if (!sessionAccount && currentUser.firebaseUid && window.MitaliFirebase && window.MitaliFirebase.getUserProfile) {
    try {
      const authUser = window.MitaliFirebase.authUser();
      if (authUser && authUser.uid === currentUser.firebaseUid) {
        sessionAccount = await window.MitaliFirebase.getUserProfile(authUser.uid, { source: navigator.onLine ? "server" : undefined });
        if (sessionAccount) DB.staffAccounts = [...(DB.staffAccounts || []).filter(a => a.firebaseUid !== sessionAccount.firebaseUid), sessionAccount];
      }
    } catch (profileReadError) { console.warn("Current profile restore failed:", profileReadError); }
  }
  if (!sessionAccount || sessionAccount.status === "موقوف") { clearSession(); renderLogin(); return; }
  if (!(await validateSessionSecurity())) {
    clearSession();
    renderLogin("انتهت صلاحية الجلسة الأمنية. سجّل الدخول مرة أخرى.");
    return;
  }
  const savedPage = getSavedPage();
  state.page = savedPage && isPageAccessible(savedPage) ? savedPage : firstAccessiblePage();
  resetIdleTimer();
  // عند وجود كاش محلي، نعرض الصفحة فورًا ثم نجلب النسخة الأحدث من Firebase
  // في الخلفية؛ لا نغيّر شاشة الدخول ولا جلسة المستخدم أثناء هذا التحديث.
  route();
  if (STORAGE_MODE === "firestore") {
    subscribeFirestoreRealtime();
    flushSyncQueue();
  }
  if (currentUser && STORAGE_MODE === "firestore") schedulePageDataLoad(state.page);
}
boot();
